                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - &id012
        name: importId
        in: path
        required: true
        description: Inventory Import ID
        schema:
          type: string
          format: uuid
  /inventory/imports/{importId}/confirmation:
    post:
      tags:
      - Inventory - Imports
      operationId: confirmInventoryImport
      summary: 整批确认并原子写入库存
      responses:
        '200':
          description: Import Confirm Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImportConfirmResult'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 当前 Organization 下资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - *id012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryImportConfirmRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Access Token
  schemas:
    EntityReference:
      type: object
      required:
      - id
      - name
      properties:
        id: *id001
        name:
          type: string
    CategoryReference:
      allOf:
      - $ref: '#/components/schemas/EntityReference'
      - type: object
        required:
        - slug
        properties:
          slug:
            type: string
    Pagination:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      - hasNextPage
      - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    CursorPageInfo:
      type: object
      required:
      - nextCursor
      - hasNextPage
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: 后端生成的不透明分页标记；客户端原样回传。
        hasNextPage:
          type: boolean
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ApiError:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    InventoryItemReference:
      type: object
      required:
      - id
      properties:
        id: *id001
    ProductSummary:
      type: object
      required:
      - id
      - visibilityScope
      - editable
      - name
      - brand
      - category
      - unit
      - inventoryItem
      properties:
        id: *id001
        visibilityScope:
          type: string
          enum:
          - global
          - organization
        editable:
          type: boolean
        name:
          type: string
        brand:
          $ref: '#/components/schemas/EntityReference'
        category:
          $ref: '#/components/schemas/CategoryReference'
        manufacturer: &id013
          type:
          - string
          - 'null'
        mfgNumber: *id013
        barcode: *id013
        specification: *id013
        unit:
          $ref: '#/components/schemas/EntityReference'
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: 带有效期的临时图片读取地址。
        inventoryItem:
          anyOf:
          - $ref: '#/components/schemas/InventoryItemReference'
          - type: 'null'
          description: 当前 Product 对应的诊所 Inventory Item；尚未加入库存时为 null。
    ProductDetail:
      allOf:
      - $ref: '#/components/schemas/ProductSummary'
      - type: object
        required:
        - sourceType
        - status
        - createdAt
        - updatedAt
        properties:
          sourceType:
            type: string
            enum:
            - imported
            - manual
            - admin_created
          source: *id013
          sourceProductCode: *id013
          status:
            type: string
            enum:
            - active
            - inactive
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    ProductPage:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ManualProductInput:
      type: object
      required:
      - name
      - brandId
      - categoryId
      - unitId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        brandId: *id001
        categoryId: *id001
        manufacturer:
          type:
          - string
          - 'null'
          maxLength: 200
        mfgNumber:
          type:
          - string
          - 'null'
          maxLength: 160
        barcode:
          type:
          - string
          - 'null'
          maxLength: 160
        specification:
          type:
          - string
          - 'null'
          maxLength: 2000
        unitId: *id001
    ProductUpdateRequest:
      $ref: '#/components/schemas/ManualProductInput'
      description: 仅 Owner Organization 的 Manual Product 可修改。
    InventorySettingsInput:
      type: object
      required:
      - quantityOnHand
      - lowStockThreshold
      properties:
        quantityOnHand: &id014
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
          examples: &id018
          - '0.00'
          - '12.50'
          description: 非负数量或金额；最多两位小数。具体字段可附加大于零约束。
        lowStockThreshold: *id014
        location:
          type:
          - string
          - 'null'
          maxLength: 240
        vendor:
          type:
          - string
          - 'null'
          maxLength: 200
        vendorItemNumber:
          type:
          - string
          - 'null'
          maxLength: 160
        purchasePrice:
          anyOf:
          - *id014
          - type: 'null'
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        internalNote:
          type:
          - string
          - 'null'
          maxLength: 2000
    DuplicateAcknowledgement:
      type: object
      description: 用户已经确认仍要继续添加的一个疑似重复商品。后端必须重新校验该 Product 确实是本次请求的疑似重复候选，并且对当前 Organization 可见。
      required:
      - productId
      properties:
        productId: *id001
    AddLibraryInventoryItemRequest:
      title: Use an existing Product Library product
      type: object
      required:
      - sourceType
      - productId
      - inventory
      properties:
        sourceType:
          const: library_product
        productId: *id001
        inventory:
          $ref: '#/components/schemas/InventorySettingsInput'
        duplicateAcknowledgements:
          type: array
          description: 疑似重复确认列表。首次提交传空数组或省略；用户确认继续后，重试时加入已确认疑似重复商品的 `productId`。若确认多个候选，则分别加入数组。
          items:
            $ref: '#/components/schemas/DuplicateAcknowledgement'
          default: []
    AddManualInventoryItemRequest:
      title: Create a Manual Product and add it to Inventory
      type: object
      required:
      - sourceType
      - product
      - inventory
      properties:
        sourceType:
          const: manual_product
        product:
          $ref: '#/components/schemas/ManualProductInput'
        inventory:
          $ref: '#/components/schemas/InventorySettingsInput'
        duplicateAcknowledgements:
          type: array
          description: 疑似重复确认列表。首次提交传空数组或省略；用户确认继续后，重试时加入已确认疑似重复商品的 `productId`。若确认多个候选，则分别加入数组。
          items:
            $ref: '#/components/schemas/DuplicateAcknowledgement'
          default: []
    AddInventoryItemRequest:
      oneOf:
      - $ref: '#/components/schemas/AddLibraryInventoryItemRequest'
      - $ref: '#/components/schemas/AddManualInventoryItemRequest'
      discriminator:
        propertyName: sourceType
        mapping:
          library_product: '#/components/schemas/AddLibraryInventoryItemRequest'
          manual_product: '#/components/schemas/AddManualInventoryItemRequest'
    InventoryItemSummary:
      type: object
      required:
      - id
      - product
      - brand
      - category
      - quantityOnHand
      - unit
      - lowStockThreshold
      - inventoryStatus
      - expiryStatus
      - version
      - createdAt
      - updatedAt
      properties:
        id: *id001
        product:
          $ref: '#/components/schemas/EntityReference'
        brand:
          $ref: '#/components/schemas/EntityReference'
        category:
          $ref: '#/components/schemas/CategoryReference'
        mfgNumber: *id013
        barcode: *id013
        quantityOnHand: *id014
        unit:
          $ref: '#/components/schemas/EntityReference'
        lowStockThreshold: *id014
        inventoryStatus:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        expiryStatus:
          type: string
          enum:
          - not_set
          - normal
          - expiring_soon
          - expired
        location: *id013
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InventoryCapabilities:
      type: object
      required:
      - canEditInventory
      - canEditProduct
      - canAdjustQuantity
      - canRemove
      properties:
        canEditInventory:
          type: boolean
        canEditProduct:
          type: boolean
        canAdjustQuantity:
          type: boolean
        canRemove:
          type: boolean
    InventoryItemDetail:
      allOf:
      - $ref: '#/components/schemas/InventoryItemSummary'
      - type: object
        required:
        - productDetail
        - currencyCode
        - capabilities
        properties:
          productDetail:
            $ref: '#/components/schemas/ProductDetail'
          vendor: *id013
          vendorItemNumber: *id013
          purchasePrice:
            anyOf:
            - *id014
            - type: 'null'
          currencyCode:
            type: string
            pattern: ^[A-Z]{3}$
          internalNote: *id013
          capabilities:
            $ref: '#/components/schemas/InventoryCapabilities'
    InventoryItemPage:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    InventoryItemUpdateRequest:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        lowStockThreshold: *id014
        location:
          type:
          - string
          - 'null'
          maxLength: 240
        vendor:
          type:
          - string
          - 'null'
          maxLength: 200
        vendorItemNumber:
          type:
          - string
          - 'null'
          maxLength: 160
        purchasePrice:
          anyOf:
          - *id014
          - type: 'null'
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        internalNote:
          type:
          - string
          - 'null'
          maxLength: 2000
    InventoryItemUpdateResult:
      type: object
      required:
      - changed
      - inventoryItem
      properties:
        changed:
          type: boolean
        inventoryItem:
          $ref: '#/components/schemas/InventoryItemDetail'
    QuantityAdjustmentRequest:
      type: object
      required:
      - expectedVersion
      - mode
      - quantity
      - reasonCode
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - increase
          - decrease
          - set_quantity
          description: 数量调整方式：increase 增加、decrease 减少、set_quantity 直接设置为指定数量。
        quantity: *id014
        reasonCode:
          type: string
          enum:
          - new_stock_received
          - product_used
          - damaged_or_expired
          - physical_stock_count_correction
          - data_correction
          - other
        note:
          type:
          - string
          - 'null'
          maxLength: 2000
        occurredAt:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            mode:
              enum:
              - increase
              - decrease
          required:
          - mode
        then:
          properties:
            quantity: &id015
              type: string
              pattern: ^(?:0\.(?:0[1-9]|[1-9]\d?)|[1-9]\d*(?:\.\d{1,2})?)$
              examples:
              - '0.01'
              - '12.50'
              description: 大于零的数量；最多两位小数。
    Activity:
      type: object
      required:
      - id
      - inventoryItemId
      - productId
      - productName
      - unitName
      - eventType
      - performedBy
      - occurredAt
      properties:
        id: *id001
        inventoryItemId: *id001
        productId: *id001
        productName:
          type: string
        unitName:
          type: string
        eventType:
          type: string
          enum:
          - increase
          - decrease
          - set_quantity
          - item_added
          - item_edited
          - item_removed
          - purchase_receipt
          - import_adjustment
        quantityBefore:
          anyOf:
          - *id014
          - type: 'null'
        quantityDelta:
          anyOf:
          - &id016
            type: string
            pattern: ^-?(0|[1-9]\d*)(\.\d{1,2})?$
            examples:
            - '-2.00'
            - '0.00'
            - '12.50'
          - type: 'null'
        quantityAfter:
          anyOf:
          - *id014
          - type: 'null'
        reasonCode: *id013
        reasonLabel: *id013
        note: *id013
        performedBy:
          type: object
          required:
          - memberId
          - displayName
          properties:
            memberId: *id001
            displayName:
              type: string
        purchaseReceiptId:
          type:
          - string
          - 'null'
          format: uuid
        inventoryImportId:
          type:
          - string
          - 'null'
          format: uuid
        occurredAt:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        pagination:
          $ref: '#/components/schemas/Pagination'
    QuantityAdjustmentResult:
      type: object
      required:
      - inventoryItem
      - activity
      properties:
        inventoryItem:
          $ref: '#/components/schemas/InventoryItemSummary'
        activity:
          $ref: '#/components/schemas/Activity'
    PurchaseListBlockers:
      type: object
      required:
      - purchaseLists
      properties:
        purchaseLists:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
    OnboardingRequest:
      type: object
      required:
      - clinicName
      - clinicContactEmail
      - firstName
      - lastName
      - termsAccepted
      - privacyAccepted
      properties:
        clinicName:
          type: string
          minLength: 1
          maxLength: 200
        clinicContactEmail:
          type: string
          format: email
          maxLength: 320
          examples:
          - office@example.com
          description: '诊所的主要业务联系邮箱，可以与 Work Email 相同。用于诊所账户、服务、安全及其他必要运营沟通，不代表同意接收营销邮件。


            **UI helper text:** HexaDent will use this address for clinic account, service, security, and other essential
            operational communications. It may be different from your sign-in email.'
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        termsAccepted:
          const: true
          description: 明确接受当前 Terms of Service。版本号由服务端决定并持久化。
        privacyAccepted:
          const: true
          description: 明确接受当前 Privacy Policy。版本号由服务端决定并持久化。
      description: 仅在 Supabase 邮箱验证成功后提交。用户身份与登录邮箱来自 Access Token，不接受密码或客户端指定的 userId、文档版本、角色及状态。
    OnboardingResult:
      type: object
      required:
      - status
      - nextAction
      properties:
        status:
          const: completed
        nextAction:
          const: enter_workspace
          description: 客户端应刷新 `GET /me` 并进入 Workspace。
      example:
        status: completed
        nextAction: enter_workspace
    EmailRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    MessageResult:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    MeResponse:
      type: object
      required:
      - user
      - membership
      - organization
      properties:
        user:
          type: object
          required:
          - id
          - firstName
          - lastName
          - fullName
          - email
          properties:
            id: *id001
            firstName:
              type: string
            lastName:
              type: string
            fullName:
              type: string
            email:
              type: string
              format: email
        membership:
          type: object
          required:
          - id
          - role
          - status
          properties:
            id: *id001
            role:
              type: string
              enum:
              - admin
              - manager
              - member
            status:
              type: string
              enum:
              - pending_activation
              - active
              - disabled
        organization:
          type: object
          required:
          - id
          - name
          - timezone
          - currencyCode
          properties:
            id: *id001
            name:
              type: string
            timezone:
              type: string
              examples:
              - America/Toronto
            currencyCode:
              type: string
              examples:
              - CAD
    ProfileUpdateRequest:
      type: object
      required:
      - firstName
      - lastName
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
    Profile:
      type: object
      required:
      - id
      - firstName
      - lastName
      - fullName
      - email
      properties:
        id: *id001
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
          readOnly: true
    Organization:
      type: object
      required:
      - id
      - name
      - clinicContactEmail
      - countryCode
      - timezone
      - currencyCode
      - status
      properties:
        id: *id001
        name:
          type: string
        clinicContactEmail:
          type: string
          format: email
          readOnly: true
          description: 注册时指定的诊所主要业务联系邮箱。MVP 中只读，不等同于当前用户的 Account Email。
        addressLine1: *id013
        addressLine2: *id013
        city: *id013
        subdivisionCode:
          type:
          - string
          - 'null'
          examples:
          - CA-ON
        postalCode: *id013
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          examples:
          - CA
        timezone:
          type: string
          examples:
          - America/Toronto
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
          examples:
          - CAD
        status:
          type: string
          enum:
          - pending_activation
          - active
          - suspended
          - closed
    OrganizationUpdateRequest:
      type: object
      minProperties: 1
      description: 仅更新请求中实际提交的字段，支持 Clinic Information 与 Regional Settings 分别保存。地址类字段可显式传 null 清空；name、countryCode、timezone 和 currencyCode 不接受 null。未知字段会被忽略，但请求必须至少包含一个可更新字段。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        addressLine1:
          type:
          - string
          - 'null'
          maxLength: 255
        addressLine2:
          type:
          - string
          - 'null'
          maxLength: 255
        city:
          type:
          - string
          - 'null'
          maxLength: 120
        subdivisionCode:
          type:
          - string
          - 'null'
          maxLength: 10
        postalCode:
          type:
          - string
          - 'null'
          maxLength: 32
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        timezone:
          type: string
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
    OrganizationUpdateResult:
      type: object
      required:
      - organization
      - currencyChanged
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        currencyChanged:
          type: boolean
    LocalizationOptions:
      type: object
      required:
      - countries
      - currencies
      - timezones
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryOption'
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyOption'
        timezones:
          type: array
          items:
            $ref: '#/components/schemas/TimezoneOption'
    CountryOption:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 code。
          examples:
          - CA
        name:
          type: string
          examples:
          - Canada
    CurrencyOption:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 alphabetic code。
          examples:
          - CAD
        name:
          type: string
          examples:
          - Canadian Dollar
    TimezoneOption:
      type: object
      required:
      - id
      - label
      properties:
        id:
          type: string
          description: IANA Timezone ID。
          examples:
          - America/Toronto
        label:
          type: string
          examples:
          - Toronto (Eastern Time)
    LookupCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
    EntityReferenceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
    CategoryList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
