      summary: 获取 Product 详情
      responses:
        '200':
          description: Product 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 当前 Organization 下资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: productId
        in: path
        required: true
        description: Product ID
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Products
      operationId: updateManualProduct
      summary: 修改当前诊所拥有的 Manual Product
      responses:
        '200':
          description: 更新后的 Product
          content:
            application/json:
              schema:
