    ForecastPurchaseListReference:
      type: object
      description: 该 Buying Need 对应商品所在的一个 Active Purchase List，以及该商品在该 List 中的收货状态。
      required:
      - id
      - name
      - receiptStatus
      properties:
        id:
          type: string
          format: uuid
          description: Purchase List ID；前端用它进入 Purchase List Detail。
        name:
          type: string
          description: Purchase List Name。
        receiptStatus:
          type: string
          enum:
          - pending
          - partially_received
          - received
          description: 当前 Forecast Item 在该 Purchase List 中的收货状态。
    ForecastDataSufficiency:
      type: object
      description: 该商品是否有足够的 Product Used 历史数据用于计算预测字段。
      required:
      - status
      - completeWeeks
      - reason
      properties:
        status:
          type: string
          enum:
          - sufficient
          - insufficient
        completeWeeks:
          type: integer
          minimum: 0
          maximum: 12
          description: 实际用于评估的完整历史周数，最多 12 周。
        reason:
          type:
          - string
          - 'null'
          enum:
          - fewer_than_4_complete_weeks
          - no_valid_consumption
          - null
          description: 数据充分时为 null；不足时返回稳定 Reason Code。
    ForecastItem:
      type: object
      description: Forecasted Buying Needs 表格中的一行。数量字段均使用该商品的 Unit。
      required:
      - inventoryItemId
      - productName
      - category
      - currentStock
      - unitName
      - averageWeeklyUse
      - predictedRunoutDate
      - recommendedQuantity
      - orderByDate
      - activePurchaseLists
      - dataSufficiency
      properties:
        inventoryItemId:
          type: string
          format: uuid
          description: Inventory Item ID。
        productName:
          type: string
          description: 当前 Product Name。
        category:
          $ref: '#/components/schemas/CategoryReference'
        currentStock:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
          examples: *id018
          description: 当前 Quantity On Hand。
        unitName:
          type: string
          description: 所有数量字段使用的 Unit。
        averageWeeklyUse:
          anyOf:
          - *id014
          - type: 'null'
          description: 最多最近 12 个完整周的平均 Product Used 数量；数据不足时为 null。
        predictedRunoutDate:
          type:
          - string
          - 'null'
          format: date
          description: 预计 Current Stock 降至 0 的诊所本地日期；无法预测时为 null。
        recommendedQuantity:
          anyOf:
          - *id014
          - type: 'null'
          description: 覆盖未来 30 天预计消耗并恢复 Minimum Quantity 的建议购买数量；无法预测时为 null。
        orderByDate:
          type:
          - string
          - 'null'
          format: date
          description: 建议下单日期，通常为预计达到 Minimum Quantity 日期前 7 天；无法预测时为 null。
        activePurchaseLists:
          type: array
          description: 该 Inventory Item 所在的全部 Active Purchase Lists；不在任何 Active List 时返回空数组。
          items:
            $ref: '#/components/schemas/ForecastPurchaseListReference'
        dataSufficiency:
          $ref: '#/components/schemas/ForecastDataSufficiency'
    ForecastItemList:
      type: object
      description: 后端固定按 orderByDate ASC NULLS LAST、predictedRunoutDate ASC NULLS LAST、productName ASC、inventoryItemId ASC
        排序。MVP 最多返回前 100 条；前端每页展示 5 条。
      required:
      - items
      - totalItems
      - maxItems
      - truncated
      properties:
        items:
          type: array
          maxItems: 100
          description: 按固定顺序一次返回，前端每页展示 5 条并自行分页与日期定位。
          items:
            $ref: '#/components/schemas/ForecastItem'
        totalItems:
          type: integer
          minimum: 0
          description: 符合 Forecasted Buying Needs 条件的总数。
        maxItems:
          type: integer
          const: 100
        truncated:
          type: boolean
          description: totalItems 大于 maxItems 时为 true；Calendar 仍只基于本次实际返回的 items 生成。
    RecommendedOrderDay:
      type: object
      description: Calendar 中一个有 Buying Needs 的高亮日期。
      required:
      - date
      - highestPriority
      - itemCount
      properties:
        date:
          type: string
          format: date
          description: 与 ForecastItem.orderByDate 对应的诊所本地日期。
        highestPriority:
          type: string
          enum:
          - high
          - medium
          - reorder_soon
          - planned
          description: 该日期所有匹配 Items 的最高优先级，仅用于 Calendar 颜色提示。
        itemCount:
          type: integer
          minimum: 1
          description: 本次实际返回的 forecastedBuyingNeeds.items 中，orderByDate 等于该日期的 Item 数量。
    RecommendedOrderMonth:
      type: object
      description: Recommended Order Timing Calendar 中的一个自然月。
      required:
      - month
      - days
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Calendar Month，格式 YYYY-MM。
        days:
          type: array
          description: 按 date ASC 返回；无建议下单日期时为空数组。只基于本次实际返回的 Buying Needs Items 生成。
          items:
            $ref: '#/components/schemas/RecommendedOrderDay'
    RecommendedOrderTiming:
      type: object
      description: Forecasted Buying Needs 的 Calendar 聚合视图。
      required:
      - fromMonth
      - toMonth
      - months
      properties:
        fromMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 允许查看的第一个月份，等于 Analysis Month。
        toMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 允许查看的最后一个月份，等于 Analysis Month 后第 3 个自然月。
        months:
          type: array
          minItems: 4
          maxItems: 4
          description: 固定按月份升序包含 Analysis Month 及之后 3 个自然月。
          items:
            $ref: '#/components/schemas/RecommendedOrderMonth'
    AnalyticsOverview:
      type: object
      description: Analytics 页面的顶部指标与 Usage Breakdown。
      required:
      - analysisMonth
      - fromDate
      - toDate
      - timezone
      - summary
      - usageBreakdown
      - asOf
      properties:
        analysisMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        summary:
          $ref: '#/components/schemas/AnalyticsSummary'
        usageBreakdown:
          $ref: '#/components/schemas/UsageBreakdown'
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        analysisMonth: 2026-08
        fromDate: '2026-08-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        summary:
          monthlyConsumption: '406.00'
          monthlyConsumptionChangePercentage: '12.00'
          itemsReachingReorder: 18
          predictedStockouts: 8
        usageBreakdown:
          totalQuantityUsed: '406.00'
          items:
          - category:
              id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
              name: Disposables
              slug: disposables
            quantityUsed: '154.00'
            percentage: '37.93'
        asOf: '2026-08-12T11:30:45-04:00'
    ForecastedBuyingNeedsResponse:
      type: object
      description: Forecasted Buying Needs 列表及其 Recommended Order Timing Calendar；两者来自同一预测快照和同一实际返回的 Items 集合。
      required:
      - analysisMonth
      - timezone
      - forecastedBuyingNeeds
      - recommendedOrderTiming
      - asOf
      properties:
        analysisMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 按 Organization Timezone 解释的分析月份。
        timezone:
          type: string
          examples:
          - America/Toronto
        forecastedBuyingNeeds:
          $ref: '#/components/schemas/ForecastItemList'
        recommendedOrderTiming:
          $ref: '#/components/schemas/RecommendedOrderTiming'
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。 这里表示本次采购预测快照的数据时间点。
      example:
        analysisMonth: 2026-08
        timezone: America/Toronto
        forecastedBuyingNeeds:
          items:
          - inventoryItemId: 8e41d6c8-b0ce-49de-aa8a-eef2f0da7322
            productName: Nitrile Exam Gloves
            category:
              id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
              name: Disposables
              slug: disposables
            currentStock: '8.00'
            unitName: Box
            averageWeeklyUse: '2.50'
            predictedRunoutDate: '2026-09-03'
            recommendedQuantity: '13.00'
            orderByDate: '2026-08-20'
            activePurchaseLists:
            - id: 45c2cd56-3ee2-48b4-986a-51792970a67e
              name: August Restock
              receiptStatus: partially_received
            dataSufficiency:
              status: sufficient
              completeWeeks: 12
              reason: null
          - inventoryItemId: f4273f5f-4044-4f37-9d4c-b6d13b1c86d3
            productName: Universal Composite A2
            category:
              id: 0dd6feea-e03e-493f-9408-7a3e5b947c77
              name: Restorative
              slug: restorative
            currentStock: '12.00'
            unitName: Syringe
            averageWeeklyUse: '1.25'
            predictedRunoutDate: '2026-09-22'
            recommendedQuantity: '8.00'
            orderByDate: '2026-09-08'
            activePurchaseLists: []
            dataSufficiency:
              status: sufficient
              completeWeeks: 10
              reason: null
          totalItems: 2
          maxItems: 100
          truncated: false
        recommendedOrderTiming:
          fromMonth: 2026-08
          toMonth: 2026-11
          months:
          - month: 2026-08
            days:
            - date: '2026-08-20'
              highestPriority: reorder_soon
              itemCount: 1
          - month: 2026-09
            days:
            - date: '2026-09-08'
              highestPriority: planned
              itemCount: 1
          - month: 2026-10
            days: []
          - month: 2026-11
            days: []
        asOf: '2026-08-12T11:30:45-04:00'
