      summary: 更新 shared Draft item
      description: '`plannedQuantity` 是保存后的最终 total，不是 delta，最大为 `999999.99`；未提供的可选字段保持不变，显式 null 清空可空字段。首次执行新的幂等请求时先校验 `expectedVersion`；stale version 即使提交值与当前值相同也返回 `PURCHASE_DRAFT_VERSION_CONFLICT`。只有当前 version 且提交值与当前持久化值相同时返回当前 item，`version` 和 `updatedAt` 不变；该 200 no-op 会完成幂等记录。已完成的相同 key 与 material payload 重试回放原结果。'
