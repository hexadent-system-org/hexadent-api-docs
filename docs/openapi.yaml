      responses:
        '204': {description: 已移除}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许操作, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 当前 Organization 下不存在；跨租户 ID 同样返回 404, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Draft version 或幂等请求冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: If-Match 缺失或格式错误, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /purchase-lists:
    get:
      tags: [Purchase Lists]
      operationId: listPurchaseLists
      summary: 查询 Purchase Lists
      description: 所有 active Member 可读。Cancelled 不出现在 MVP 列表。`keyword` 先做 Unicode NFKC、连续空白折叠和大小写归一化，再仅对 List name 做包含搜索；notes 和 item snapshot 字段不参与搜索。默认按 `updatedAt DESC, id DESC` 稳定排序。
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [approved, ordered, completed]
      - *id002
      - *id003
      - *id004
      responses:
        '200': {description: Purchase List 分页结果, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListPage'}}}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许访问, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 查询参数未通过校验, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    post:
      tags: [Purchase Lists]
      operationId: approvePurchaseDraftItems
      summary: 审批所选 Draft items 并创建 Purchase List
      description: 仅 actual actor 为 Admin/Manager 时允许。selected approver 必须是同 Organization 的 active Admin/Manager。服务端在单一幂等事务校验全部 item version、创建 Approved snapshot 并移除所选 Draft items；任一失败均不产生部分写入。同一请求重复 `draftItemId`（即使 expectedVersion 不同）返回 `REQUEST_VALIDATION_ERROR` 422，不创建 List 或移除 Draft item。
      parameters: [*id006]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseListApprovalRequest'}
            example:
              name: September restorative order
              notes: Approved for weekly purchasing
              selectedApproverMembershipId: 33333333-3333-4333-8333-333333333333
              draftItems:
              - draftItemId: 44444444-4444-4444-8444-444444444444
                expectedVersion: 3
      responses:
        '201': {description: 新建且不可编辑的 Approved Purchase List, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListDetail'}}}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: actor 或 selected approver 不满足权限要求, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 任一资源在当前 Organization 下不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Draft version、state 或幂等请求冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 字段或所选 Draft 集合未通过校验, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /purchase-lists/{purchaseListId}:
    get:
      tags: [Purchase Lists]
      operationId: getPurchaseList
      summary: 获取 Purchase List 审计详情
      description: 所有 active Member 可读。已知 ID 可返回 Cancelled snapshot；跨租户 ID 与不存在一致返回 404。
      parameters:
      - &id008
        name: purchaseListId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200': {description: Purchase List 与 item snapshots, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListDetail'}}}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许访问, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 当前 Organization 下不存在；跨租户 ID 同样返回 404, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /purchase-lists/{purchaseListId}/order:
    post:
      tags: [Purchase Lists]
      operationId: orderPurchaseList
      summary: 将 Approved List 标记为 Ordered
      description: 所有 active Member 可执行；只允许 `approved → ordered`，内容 snapshot 不变。
      parameters: [*id008, *id006]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListVersionRequest'}}}
      responses:
        '200': {description: Ordered Purchase List, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListDetail'}}}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许操作, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 当前 Organization 下不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: List state/version 或幂等请求冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 请求未通过校验, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /purchase-lists/{purchaseListId}/cancellation:
    post:
      tags: [Purchase Lists]
      operationId: cancelPurchaseList
      summary: 取消未收货的 Approved List
      description: 所有 active Member 可执行。仅 Approved 且没有 receipt history 时允许；保留 Cancelled snapshot，并在同一事务把 planned quantities 恢复到 shared Draft。若 Inventory Item 已有 Draft row，只累加 plannedQuantity 并保留该 row 当前的 vendor、vendorItemNumber、unitPrice 和 notes；合计超过 `999999.99` 时返回 409，用户需先减少当前 Draft quantity。若没有 Draft row，则从 Cancelled item snapshot 初始化 metadata；为了兼容上限生效前的不可变历史 snapshot，此恢复可保留超过当前输入上限的旧值，用户之后只能将其修改到 `999999.99` 以内。任一失败均不产生部分写入。
      parameters: [*id008, *id006]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseListCancellationRequest'}
            example: {expectedListVersion: 2, reason: Duplicate order}
      responses:
        '200': {description: Cancelled snapshot 与 Draft restore 结果, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListCancellationResult'}}}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许操作, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 当前 Organization 下不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: List state/version、receipt history 或幂等请求冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 请求未通过校验, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /purchase-lists/{purchaseListId}/completion:
    post:
      tags: [Purchase Lists]
      operationId: completePurchaseList
      summary: 完成 Ordered Purchase List
      description: 所有 active Member 可执行。允许 zero-received、short、exact 和 over；存在 variance 且 `confirmVariance=false` 时返回 `PURCHASE_LIST_VARIANCE_CONFIRMATION_REQUIRED` 与 summary。确认后只转换状态并写 audit，不调整 Inventory。
      parameters: [*id008, *id006]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListCompletionRequest'}}}
      responses:
        '200': {description: Completed Purchase List, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseListDetail'}}}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许操作, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 当前 Organization 下不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: List state/version、variance confirmation 或幂等请求冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 请求未通过校验, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /purchase-lists/{purchaseListId}/export:
    get:
      tags: [Purchase Lists]
      operationId: exportPurchaseList
      summary: 导出 Purchase List snapshot
      description: 所有 active Member 仅可导出 Approved List，最多 1,000 items；Ordered、Completed 和 Cancelled 均不可导出，并返回说明仅 Approved 可导出的 409。CSV 是带 BOM 的 UTF-8、RFC 4180 单一 header + data rows 表格，List name 只通过下载文件名表达，不添加 metadata preamble；为防止 spreadsheet formula injection，Vendor Item Number、Vendor、Description、Unit 中忽略前导空白及 Unicode control/format 字符后以 `=`、`+`、`-`、`@` 开头的值会添加 apostrophe 安全前缀，机器消费者应以 `utf-8-sig` 解码并保留该转换。CSV header 与 PDF item table 固定为 Vendor Item Number、Vendor、Description、Unit、Qty、Unit Price、Total Price；Description 是 Product Name snapshot，Qty 是 planned quantity，Total Price 使用 Decimal 精确计算为 Qty × Unit Price，Unit Price 为空时 Total Price 也为空。PDF header 固定为 List name、actual approver、approved at 和 notes，并为长内容分页、换行和重复 item table header。若 snapshot 含当前 PDF 字体无法呈现的字符，PDF 返回非重试型 422 并提示改用 CSV；其他文件生成依赖失败仍返回安全、可重试的 503。响应必须设置正确 Content-Type，并使用 `filename` ASCII fallback 与 RFC 5987 `filename*` UTF-8 编码支持 Unicode List name。
      parameters:
      - *id008
      - name: format
        in: query
        required: true
        schema: {type: string, enum: [csv, pdf]}
      responses:
        '200':
          description: Approved Purchase List 的 CSV 或 PDF 文件流，包含 Content-Disposition attachment header
          headers:
            Content-Disposition:
              required: true
              schema: {type: string}
              example: attachment; filename="purchase-list-0195a9f0-7c1a-7a2b-8c3d-4e5f60718293.csv"; filename*=UTF-8''September%20Order.csv
          content:
            text/csv: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许导出, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 当前 Organization 下不存在；跨租户 ID 同样返回 404, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Ordered、Completed 或 Cancelled List 不允许导出, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '413': {description: 'List 超过 1,000 items', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: format 未通过校验，或 PDF snapshot 含当前字体无法呈现的字符（`PDF_EXPORT_UNSUPPORTED_CHARACTERS`，可改用 CSV）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '503': {description: 文件生成依赖暂不可用, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
