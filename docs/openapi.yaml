      responses:
        '200':
          description: 更新后的 Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 当前 Organization 下资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: productId
        in: path
        required: true
        description: Product ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
  /inventory/items:
    get:
      tags:
      - Inventory - Items
      operationId: listInventoryItems
      summary: 查询有效库存
      responses:
        '200':
          description: 库存分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemPage'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
