  /purchase-draft/items:
    get:
      tags: [Purchase Lists]
      operationId: listPurchaseDraftItems
      summary: 查询 Organization shared Purchase Draft
      description: 所有 active Member 可读。默认按 `updatedAt DESC, id DESC` 稳定排序；分页期间数据变化时客户端应从第一页刷新。
      parameters:
      - name: keyword
        in: query
        schema: {type: string, maxLength: 300}
        description: 仅按 Product Name 做不区分大小写的包含搜索。Brand、Manufacturer、MFG Number 和 Barcode 不参与该 keyword 搜索；Vendor 仅通过独立的 `vendor` 参数筛选。
      - name: vendor
        in: query
        schema: {type: string, maxLength: 160}
        description: 自由文本筛选。服务端对查询值与 Draft item 的非 null Vendor 值执行相同的 Unicode NFKC、连续空白折叠、trim 和大小写归一化，再做包含匹配；省略或规范化后为空表示不过滤，非空查询不匹配 null Vendor。
      - *id003
      - *id004
      responses:
        '200':
          description: Draft item 分页结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseDraftItemPage'}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许访问, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 查询参数未通过校验, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    post:
      tags: [Purchase Lists]
      operationId: addPurchaseDraftItems
      summary: 批量加入 shared Purchase Draft
      description: 所有 active Member 可写。每次请求最多 100 items；每个 `plannedQuantity` 最大为 `999999.99`。超过上限返回 `REQUEST_VALIDATION_ERROR` 422；请求全有或全无，任何 422 都不写入。每个 Inventory Item 在 Draft 最多一行。已存在项不会累加，成功响应返回其当前 item 与 version。同一请求重复 `inventoryItemId`（即使其他字段不同）返回 `REQUEST_VALIDATION_ERROR` 422，整批不写入。
      parameters: [*id006]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseDraftBulkAddRequest'}
            example:
              items:
              - inventoryItemId: 11111111-1111-4111-8111-111111111111
                plannedQuantity: '5.00'
                vendor: K-Dental
                vendorItemNumber: KD-49135
                unitPrice: '45.00'
                notes: Order before Friday
              - inventoryItemId: 22222222-2222-4222-8222-222222222222
                plannedQuantity: '2.00'
                vendor: null
                vendorItemNumber: null
                unitPrice: null
                notes: null
      responses:
        '200':
          description: 全部条目的 added/existing 结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseDraftBulkAddResult'}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许操作, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Inventory Item 在当前 Organization 下不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: 幂等 key 与 material payload 冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 请求超过 100 items、包含重复 Inventory Item，或任一条目无效；返回 `REQUEST_VALIDATION_ERROR` 且整批不写入, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /purchase-draft/items/{draftItemId}:
