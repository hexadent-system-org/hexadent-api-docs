        in: query
        required: false
        description: 可选；只返回指定 Brand 下的 Inventory Items。
        schema: *id001
      - name: categoryId
        in: query
        required: false
        description: Category ID
        schema: *id001
      - name: inventoryStatus
        in: query
        required: false
        description: 库存状态；可重复传递
        schema:
          type: array
          items:
            type: string
            enum:
            - in_stock
            - low_stock
            - out_of_stock
      - name: expiryStatus
        in: query
        required: false
        description: 有效期状态；可重复传递
        schema:
          type: array
          items:
            type: string
            enum:
            - not_set
            - normal
            - expiring_soon
            - expired
      - *id003
      - *id004
    post:
      tags:
      - Inventory - Items
      operationId: addInventoryItem
