        items: {type: array, items: {$ref: '#/components/schemas/PurchaseListSummary'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
        counts:
          type: object
          required: [approved, ordered, completed]
          properties:
            approved: {type: integer, minimum: 0}
            ordered: {type: integer, minimum: 0}
            completed: {type: integer, minimum: 0}
    PurchaseListApprovalRequest:
      type: object
      additionalProperties: false
      required: [name, selectedApproverMembershipId, draftItems]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        notes: {type: [string, 'null'], maxLength: 2000}
        selectedApproverMembershipId: *id001
        draftItems:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [draftItemId, expectedVersion]
            properties:
              draftItemId: *id001
              expectedVersion: {type: integer, minimum: 1}
    PurchaseListVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedListVersion]
      properties:
        expectedListVersion: {type: integer, minimum: 1}
    PurchaseListCancellationRequest:
      type: object
      additionalProperties: false
      required: [expectedListVersion]
      properties:
        expectedListVersion: {type: integer, minimum: 1}
        reason: {type: [string, 'null'], maxLength: 1000}
    PurchaseListCancellationResult:
      type: object
      required: [purchaseList, restoredDraftItems]
      properties:
        purchaseList: {$ref: '#/components/schemas/PurchaseListDetail'}
        restoredDraftItems:
          type: array
          description: '`merged` 表示数量累加到已有 Draft row；`created` 表示新建。'
          items:
            type: object
            required: [disposition, draftItem]
            properties:
              disposition: {type: string, enum: [created, merged]}
              draftItem: {$ref: '#/components/schemas/PurchaseDraftItem'}
    PurchaseListCompletionRequest:
      type: object
      additionalProperties: false
      required: [expectedListVersion, confirmVariance]
      properties:
        expectedListVersion: {type: integer, minimum: 1}
        confirmVariance:
          type: boolean
          description: 有任何 zero/short/over variance 时必须为 true；exact-only List 可为 false。
    PurchaseReceiptRequest:
      type: object
      additionalProperties: false
      required: [quantityReceived, expectedListVersion, expectedItemVersion]
      properties:
        quantityReceived: {$ref: '#/components/schemas/PurchaseQuantityInput'}
        expectedListVersion: {type: integer, minimum: 1}
        expectedItemVersion: {type: integer, minimum: 1}
        vendorReceiptNumber: {type: [string, 'null'], maxLength: 160}
        receivedAt: {type: [string, 'null'], format: date-time}
    PurchaseReceiptCorrectionRequest:
      type: object
      additionalProperties: false
      required: [totalReceived, expectedListVersion, expectedItemVersion]
      properties:
        totalReceived: {$ref: '#/components/schemas/PurchaseReceivedQuantityInput'}
        expectedListVersion: {type: integer, minimum: 1}
        expectedItemVersion: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
        correctedAt: {type: [string, 'null'], format: date-time}
    PurchaseReceiptEvent:
      type: object
      required: [id, eventType, quantityDelta, totalReceivedAfter, occurredAt, actor]
      properties:
        id: *id001
        eventType: {type: string, enum: [receipt, correction]}
        quantityDelta: *id016
        totalReceivedAfter: *id014
        vendorReceiptNumber: *id013
        reason: *id013
        occurredAt: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/PurchaseActor'}
    InventoryActivityReference:
      type: object
      required: [id, inventoryItemId, version]
      properties:
        id: *id001
        inventoryItemId: *id001
        version: {type: integer, minimum: 1}
    PurchaseReceiptWarning:
      type: object
      required: [code, plannedQuantity, totalReceived, overReceivedBy]
      properties:
        code: {type: string, const: PURCHASE_ITEM_OVER_RECEIVED}
        plannedQuantity: *id015
        totalReceived: *id014
        overReceivedBy: *id015
    PurchaseReceiptResult:
      type: object
      required: [event, activity, purchaseListItem, inventoryVersion, warning]
      properties:
        event: {$ref: '#/components/schemas/PurchaseReceiptEvent'}
        activity: {$ref: '#/components/schemas/InventoryActivityReference'}
        purchaseListItem: {$ref: '#/components/schemas/PurchaseListItem'}
        inventoryVersion: {type: integer, minimum: 1}
        warning: {anyOf: [{$ref: '#/components/schemas/PurchaseReceiptWarning'}, {type: 'null'}]}
    PurchaseReceiptCorrectionResult:
      type: object
      required: [noOp, event, activity, purchaseListItem, inventoryVersion]
      properties:
        noOp: {type: boolean}
        event: {anyOf: [{$ref: '#/components/schemas/PurchaseReceiptEvent'}, {type: 'null'}]}
        activity: {anyOf: [{$ref: '#/components/schemas/InventoryActivityReference'}, {type: 'null'}]}
        purchaseListItem: {$ref: '#/components/schemas/PurchaseListItem'}
        inventoryVersion: {type: integer, minimum: 1}
        warning: {anyOf: [{$ref: '#/components/schemas/PurchaseReceiptWarning'}, {type: 'null'}]}
    PurchaseListVarianceSummary:
      type: object
      description: '`PURCHASE_LIST_VARIANCE_CONFIRMATION_REQUIRED` 的 `error.details.variance` shape。'
      required: [zeroReceivedItemCount, shortItemCount, overItemCount, items]
      properties:
        zeroReceivedItemCount: {type: integer, minimum: 0}
        shortItemCount: {type: integer, minimum: 0}
        overItemCount: {type: integer, minimum: 0}
        items:
          type: array
          items:
            type: object
            required: [purchaseListItemId, plannedQuantity, receivedQuantity, varianceQuantity, receiptStatus]
            properties:
              purchaseListItemId: *id001
              plannedQuantity: *id015
              receivedQuantity: *id014
              varianceQuantity: *id016
              receiptStatus: {type: string, enum: [not_received, partially_received, over_received]}
    DashboardSummary:
      type: object
      required:
      - totalItems
      - lowStockItems
      - outOfStockItems
      - expiringSoonItems
      properties:
        totalItems:
          type: integer
          minimum: 0
        lowStockItems:
          type: integer
          minimum: 0
        outOfStockItems:
          type: integer
          minimum: 0
        expiringSoonItems:
          type: integer
          minimum: 0
    InventoryCategoryBreakdown:
      type: object
      required:
      - totalItems
      - categories
      properties:
        totalItems:
          type: integer
          minimum: 0
        categories:
          type: array
          description: 返回全部真实 Category，按 count DESC、Category Name ASC 排序；不返回合成的 Other。客户端展示前 5 项，并将其余项合并为 Other。
          items:
            type: object
            required:
            - category
            - count
            - percentage
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              count:
                type: integer
                minimum: 0
              percentage: *id014
    DashboardTopUsedProduct:
      type: object
      required:
      - inventoryItemId
      - inventoryItemAvailable
      - productName
      - category
      - quantityUsed
      - unitName
      - trendPercentage
      properties:
        inventoryItemId: *id001
        inventoryItemAvailable:
          type: boolean
          description: false 表示该商品已移出当前库存；前端显示历史信息，但不跳转 Inventory Item Details。
        productName:
          type: string
        category:
          $ref: '#/components/schemas/CategoryReference'
        quantityUsed: *id014
        unitName:
          type: string
        trendPercentage:
          anyOf:
          - *id016
          - type: 'null'
          description: 相对前一个 30 天周期的百分比变化；前一周期用量为 0 时返回 null。
    DashboardTopUsedProducts:
      type: object
      required:
      - period
      - items
      properties:
        period:
          type: string
          const: 30d
          description: MVP 固定统计最近 30 天。
        items:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardTopUsedProduct'
    DashboardAttentionItem:
      type: object
      required:
      - inventoryItemId
      - productName
      - category
      - quantityOnHand
      - unitName
      - lowStockThreshold
      - inventoryStatus
      - expiryDate
      - expiryStatus
      - daysUntilExpiry
      properties:
        inventoryItemId: *id001
        productName:
          type: string
        category:
          $ref: '#/components/schemas/CategoryReference'
        quantityOnHand: *id014
        unitName:
          type: string
        lowStockThreshold: *id014
        inventoryStatus:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        expiryStatus:
          type: string
          enum:
          - not_set
          - normal
          - expiring_soon
          - expired
        daysUntilExpiry:
          type:
          - integer
          - 'null'
          description: 按 Organization Timezone 的本地日期计算；已过期时为负数，未设置 Expiry Date 时为 null。
    DashboardAttentionItems:
      type: object
      required:
      - outOfStock
      - lowStock
      - expiringSoon
      properties:
        outOfStock:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionItem'
        lowStock:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionItem'
        expiringSoon:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionItem'
    DashboardPurchaseListOverview:
      type: object
      required:
      - openLists
      - itemsRemaining
      - varianceFreeOrderedLists
      - recentLists
      properties:
        openLists:
          type: integer
          minimum: 0
          description: Approved 与 Ordered Purchase Lists 总数。
        itemsRemaining:
          type: integer
          minimum: 0
          description: 所有 Approved/Ordered Lists 中 `remainingQuantity > 0` 的 Purchase List Item 行数。
        varianceFreeOrderedLists:
          type: integer
          minimum: 0
          description: 所有 items 均 exact-received、可无需 variance confirmation 完成的 Ordered List 数量。
        recentLists:
          type: array
          maxItems: 4
          description: 最近更新的 Approved/Ordered Lists，按 updatedAt DESC、id DESC 排序。
          items:
            $ref: '#/components/schemas/PurchaseListSummary'
    Dashboard:
      type: object
      required:
      - summary
      - inventoryItemsByCategory
      - topUsedProducts
      - attentionItems
      - purchaseListOverview
      - asOf
      properties:
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        inventoryItemsByCategory:
          $ref: '#/components/schemas/InventoryCategoryBreakdown'
        topUsedProducts:
          $ref: '#/components/schemas/DashboardTopUsedProducts'
        attentionItems:
          $ref: '#/components/schemas/DashboardAttentionItems'
        purchaseListOverview:
          $ref: '#/components/schemas/DashboardPurchaseListOverview'
        asOf:
          type: string
          format: date-time
          examples: &id017
          - '2026-08-12T11:30:45-04:00'
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        summary:
          totalItems: 120
          lowStockItems: 8
          outOfStockItems: 3
          expiringSoonItems: 6
        inventoryItemsByCategory:
          totalItems: 120
          categories:
          - category:
              id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
              name: Disposables
              slug: disposables
            count: 42
            percentage: '35.00'
          - category:
              id: 0dd6feea-e03e-493f-9408-7a3e5b947c77
              name: Restorative
              slug: restorative
            count: 28
            percentage: '23.33'
        topUsedProducts:
          period: 30d
          items:
          - inventoryItemId: 8e41d6c8-b0ce-49de-aa8a-eef2f0da7322
            inventoryItemAvailable: true
            productName: Nitrile Exam Gloves
            category:
              id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
              name: Disposables
              slug: disposables
            quantityUsed: '42.00'
            unitName: Box
            trendPercentage: '12.50'
        attentionItems:
          outOfStock:
          - inventoryItemId: 08f7c98d-0e52-433f-b555-05a8fc109e4e
            productName: Etch Gel
            category:
              id: 0dd6feea-e03e-493f-9408-7a3e5b947c77
              name: Restorative
              slug: restorative
            quantityOnHand: '0.00'
            unitName: Syringe
            lowStockThreshold: '5.00'
            inventoryStatus: out_of_stock
            expiryDate: null
            expiryStatus: not_set
            daysUntilExpiry: null
          lowStock: []
          expiringSoon: []
        purchaseListOverview:
          openLists: 4
          itemsRemaining: 11
          varianceFreeOrderedLists: 1
          recentLists: []
        asOf: '2026-08-12T11:30:45-04:00'
    CategoryUsageTrend:
      type: object
      required:
      - period
      - fromDate
      - toDate
      - timezone
      - granularity
      - series
      - asOf
      properties:
        period:
          type: string
          enum:
          - last_6_months
          - last_12_months
          - last_24_months
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        granularity:
          type: string
          const: month
        series:
          type: array
          description: 只返回所选周期内有 Product Used 记录的 Category；每个返回的 Category 包含完整月份序列，无用量月份补 0。
          items:
            type: object
            required:
            - category
            - points
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              points:
                type: array
                items:
                  type: object
                  required:
                  - month
                  - quantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                      examples:
                      - 2026-08
                    quantityUsed: *id014
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        period: last_6_months
        fromDate: '2026-03-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        granularity: month
        series:
        - category:
            id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
            name: Disposables
            slug: disposables
          points:
          - month: 2026-03
            quantityUsed: '32.00'
          - month: 2026-04
            quantityUsed: '0.00'
          - month: 2026-05
            quantityUsed: '41.00'
          - month: 2026-06
            quantityUsed: '38.00'
          - month: 2026-07
            quantityUsed: '45.00'
          - month: 2026-08
            quantityUsed: '18.00'
        asOf: '2026-08-12T11:30:45-04:00'
    AnalyticsConsumptionTrend:
      type: object
      required:
      - period
      - fromDate
      - toDate
      - timezone
      - granularity
      - forecastHorizonMonths
      - series
      - asOf
      properties:
        period:
          type: string
          enum:
          - last_6_months
          - last_12_months
          - last_24_months
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        granularity:
          type: string
          const: month
        forecastHorizonMonths:
          type: integer
          const: 2
        series:
          type: array
          items:
            type: object
            required:
            - category
            - actualPoints
            - forecastPoints
            - forecastDataSufficiency
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              actualPoints:
                type: array
                description: 所选历史范围内的完整自然月序列；无用量月份补 0。
                items:
                  type: object
                  required:
                  - month
                  - quantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    quantityUsed: *id014
              forecastPoints:
                type: array
                maxItems: 2
                description: 未来两个自然月的预测；数据不足时为空数组。前端以无圆点虚线绘制。
                items:
                  type: object
                  required:
                  - month
                  - predictedQuantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    predictedQuantityUsed: *id014
              forecastDataSufficiency:
                type: object
                required:
                - status
                - completeWeeks
                - reason
                properties:
                  status:
                    type: string
                    enum:
                    - sufficient
                    - insufficient
                  completeWeeks:
                    type: integer
                    minimum: 0
                    maximum: 12
                  reason:
                    type:
                    - string
                    - 'null'
                    enum:
                    - fewer_than_4_complete_weeks
                    - no_valid_consumption
                    - null
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        period: last_6_months
        fromDate: '2026-03-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        granularity: month
        forecastHorizonMonths: 2
        series:
        - category:
            id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
            name: Disposables
            slug: disposables
          actualPoints:
          - month: 2026-07
            quantityUsed: '45.00'
          - month: 2026-08
            quantityUsed: '18.00'
          forecastPoints:
          - month: 2026-09
            predictedQuantityUsed: '47.00'
          - month: 2026-10
            predictedQuantityUsed: '49.00'
          forecastDataSufficiency:
            status: sufficient
            completeWeeks: 12
            reason: null
        asOf: '2026-08-12T11:30:45-04:00'
    TimeSeries:
      type: object
      required:
      - series
      - asOf
      properties:
        series:
          type: array
          items:
            type: object
            required:
            - name
            - points
            properties:
              id:
                type:
                - string
                - 'null'
                format: uuid
              name:
                type: string
              points:
                type: array
                items:
                  type: object
                  required:
                  - period
                  - quantity
                  properties:
                    period:
                      type: string
                    quantity: *id014
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
    InventoryItemSummaryList:
      type: object
      required:
      - items
      - asOf
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemSummary'
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
    AnalyticsSummary:
      type: object
      required:
      - monthlyConsumption
      - monthlyConsumptionChangePercentage
      - itemsReachingReorder
      - predictedStockouts
      properties:
        monthlyConsumption: *id014
        monthlyConsumptionChangePercentage:
          anyOf:
          - *id016
          - type: 'null'
          description: 相对上一个自然月的百分比变化；上月用量为 0 时返回 null。
        itemsReachingReorder:
          type: integer
          minimum: 0
        predictedStockouts:
          type: integer
          minimum: 0
    UsageBreakdown:
      type: object
      required:
      - totalQuantityUsed
      - items
      properties:
        totalQuantityUsed: *id014
        items:
          type: array
          items:
            type: object
            required:
            - category
            - quantityUsed
            - percentage
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              quantityUsed: *id014
              percentage: *id014
    ForecastPurchaseListReference:
      type: object
      description: 该 Buying Need 对应商品所在的一个 Approved 或 Ordered Purchase List，以及该商品在该 List 中的收货状态。
      required:
      - id
      - name
      - status
      - receiptStatus
      properties:
        id:
          type: string
          format: uuid
          description: Purchase List ID；前端用它进入 Purchase List Detail。
        name:
          type: string
          description: Purchase List Name。
        status:
          type: string
          enum: [approved, ordered]
        receiptStatus:
          type: string
          enum:
          - not_received
          - partially_received
          - received
          - over_received
          description: 当前 Forecast Item 在该 Purchase List 中的收货状态。
    ForecastDataSufficiency:
      type: object
      description: 该商品是否有足够的 Product Used 历史数据用于计算预测字段。
      required:
      - status
      - completeWeeks
      - reason
      properties:
        status:
          type: string
          enum:
          - sufficient
          - insufficient
        completeWeeks:
          type: integer
          minimum: 0
          maximum: 12
          description: 实际用于评估的完整历史周数，最多 12 周。
        reason:
          type:
          - string
          - 'null'
          enum:
          - fewer_than_4_complete_weeks
          - no_valid_consumption
          - null
          description: 数据充分时为 null；不足时返回稳定 Reason Code。
    ForecastItem:
      type: object
      description: Forecasted Buying Needs 表格中的一行。数量字段均使用该商品的 Unit。
      required:
      - inventoryItemId
      - productName
      - category
      - currentStock
      - unitName
      - averageWeeklyUse
      - predictedRunoutDate
      - recommendedQuantity
      - orderByDate
      - purchaseLists
      - dataSufficiency
      properties:
        inventoryItemId:
          type: string
          format: uuid
          description: Inventory Item ID。
        productName:
          type: string
          description: 当前 Product Name。
        category:
          $ref: '#/components/schemas/CategoryReference'
        currentStock:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
          examples: *id018
          description: 当前 Quantity On Hand。
        unitName:
          type: string
          description: 所有数量字段使用的 Unit。
        averageWeeklyUse:
          anyOf:
          - *id014
          - type: 'null'
          description: 最多最近 12 个完整周的平均 Product Used 数量；数据不足时为 null。
        predictedRunoutDate:
          type:
          - string
          - 'null'
          format: date
          description: 预计 Current Stock 降至 0 的诊所本地日期；无法预测时为 null。
        recommendedQuantity:
          anyOf:
          - *id014
          - type: 'null'
          description: 覆盖未来 30 天预计消耗并恢复 Minimum Quantity 的建议购买数量；无法预测时为 null。
        orderByDate:
          type:
          - string
          - 'null'
          format: date
          description: 建议下单日期，通常为预计达到 Minimum Quantity 日期前 7 天；无法预测时为 null。
        purchaseLists:
          type: array
          description: 该 Inventory Item 所在的全部 Approved/Ordered Purchase Lists；没有未关闭 List 时返回空数组。
          items:
            $ref: '#/components/schemas/ForecastPurchaseListReference'
        dataSufficiency:
          $ref: '#/components/schemas/ForecastDataSufficiency'
    ForecastItemList:
      type: object
      description: 后端固定按 orderByDate ASC NULLS LAST、predictedRunoutDate ASC NULLS LAST、productName ASC、inventoryItemId ASC
        排序。MVP 最多返回前 100 条；前端每页展示 5 条。
      required:
      - items
      - totalItems
      - maxItems
      - truncated
      properties:
        items:
          type: array
          maxItems: 100
          description: 按固定顺序一次返回，前端每页展示 5 条并自行分页与日期定位。
          items:
            $ref: '#/components/schemas/ForecastItem'
        totalItems:
          type: integer
          minimum: 0
          description: 符合 Forecasted Buying Needs 条件的总数。
        maxItems:
          type: integer
          const: 100
        truncated:
          type: boolean
          description: totalItems 大于 maxItems 时为 true；Calendar 仍只基于本次实际返回的 items 生成。
    RecommendedOrderDay:
      type: object
      description: Calendar 中一个有 Buying Needs 的高亮日期。
      required:
      - date
      - highestPriority
      - itemCount
      properties:
        date:
          type: string
          format: date
          description: 与 ForecastItem.orderByDate 对应的诊所本地日期。
        highestPriority:
          type: string
          enum:
          - high
          - medium
          - reorder_soon
          - planned
          description: 该日期所有匹配 Items 的最高优先级，仅用于 Calendar 颜色提示。
        itemCount:
          type: integer
          minimum: 1
          description: 本次实际返回的 forecastedBuyingNeeds.items 中，orderByDate 等于该日期的 Item 数量。
    RecommendedOrderMonth:
      type: object
      description: Recommended Order Timing Calendar 中的一个自然月。
      required:
      - month
      - days
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Calendar Month，格式 YYYY-MM。
        days:
          type: array
          description: 按 date ASC 返回；无建议下单日期时为空数组。只基于本次实际返回的 Buying Needs Items 生成。
          items:
            $ref: '#/components/schemas/RecommendedOrderDay'
    RecommendedOrderTiming:
      type: object
      description: Forecasted Buying Needs 的 Calendar 聚合视图。
      required:
      - fromMonth
      - toMonth
      - months
      properties:
        fromMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 允许查看的第一个月份，等于 Analysis Month。
        toMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 允许查看的最后一个月份，等于 Analysis Month 后第 3 个自然月。
        months:
          type: array
          minItems: 4
          maxItems: 4
          description: 固定按月份升序包含 Analysis Month 及之后 3 个自然月。
          items:
            $ref: '#/components/schemas/RecommendedOrderMonth'
    AnalyticsOverview:
      type: object
      description: Analytics 页面的顶部指标与 Usage Breakdown。
      required:
      - analysisMonth
      - fromDate
      - toDate
      - timezone
      - summary
      - usageBreakdown
      - asOf
      properties:
        analysisMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        summary:
          $ref: '#/components/schemas/AnalyticsSummary'
        usageBreakdown:
          $ref: '#/components/schemas/UsageBreakdown'
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        analysisMonth: 2026-08
        fromDate: '2026-08-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        summary:
          monthlyConsumption: '406.00'
          monthlyConsumptionChangePercentage: '12.00'
          itemsReachingReorder: 18
          predictedStockouts: 8
        usageBreakdown:
          totalQuantityUsed: '406.00'
          items:
          - category:
              id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
              name: Disposables
              slug: disposables
            quantityUsed: '154.00'
            percentage: '37.93'
        asOf: '2026-08-12T11:30:45-04:00'
    ForecastedBuyingNeedsResponse:
      type: object
      description: Forecasted Buying Needs 列表及其 Recommended Order Timing Calendar；两者来自同一预测快照和同一实际返回的 Items 集合。
      required:
      - analysisMonth
      - timezone
      - forecastedBuyingNeeds
      - recommendedOrderTiming
      - asOf
      properties:
        analysisMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 按 Organization Timezone 解释的分析月份。
        timezone:
          type: string
          examples:
          - America/Toronto
        forecastedBuyingNeeds:
          $ref: '#/components/schemas/ForecastItemList'
        recommendedOrderTiming:
          $ref: '#/components/schemas/RecommendedOrderTiming'
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。 这里表示本次采购预测快照的数据时间点。
      example:
        analysisMonth: 2026-08
        timezone: America/Toronto
        forecastedBuyingNeeds:
          items:
          - inventoryItemId: 8e41d6c8-b0ce-49de-aa8a-eef2f0da7322
            productName: Nitrile Exam Gloves
            category:
              id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
              name: Disposables
              slug: disposables
            currentStock: '8.00'
            unitName: Box
            averageWeeklyUse: '2.50'
            predictedRunoutDate: '2026-09-03'
            recommendedQuantity: '13.00'
            orderByDate: '2026-08-20'
            purchaseLists:
            - id: 45c2cd56-3ee2-48b4-986a-51792970a67e
              name: August Restock
              status: ordered
              receiptStatus: partially_received
            dataSufficiency:
              status: sufficient
              completeWeeks: 12
              reason: null
          - inventoryItemId: f4273f5f-4044-4f37-9d4c-b6d13b1c86d3
            productName: Universal Composite A2
            category:
              id: 0dd6feea-e03e-493f-9408-7a3e5b947c77
              name: Restorative
              slug: restorative
            currentStock: '12.00'
            unitName: Syringe
            averageWeeklyUse: '1.25'
            predictedRunoutDate: '2026-09-22'
            recommendedQuantity: '8.00'
            orderByDate: '2026-09-08'
            purchaseLists: []
            dataSufficiency:
              status: sufficient
              completeWeeks: 10
              reason: null
          totalItems: 2
          maxItems: 100
          truncated: false
        recommendedOrderTiming:
          fromMonth: 2026-08
          toMonth: 2026-11
          months:
          - month: 2026-08
            days:
            - date: '2026-08-20'
              highestPriority: reorder_soon
              itemCount: 1
          - month: 2026-09
            days:
            - date: '2026-09-08'
              highestPriority: planned
              itemCount: 1
          - month: 2026-10
            days: []
          - month: 2026-11
            days: []
        asOf: '2026-08-12T11:30:45-04:00'
