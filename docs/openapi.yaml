    DuplicateAcknowledgement:
      type: object
      description: >-
        对一次“疑似重复”提示的用户确认。首次提交不需要提供；当后端返回
        `DUPLICATE_REVIEW_REQUIRED` 及 `acknowledgementToken` 后，只有用户明确选择继续添加时，
        客户端才在重试请求中原样回传该 token。它只确认后端指出的软重复候选，不能绕过
        相同 Product 已在有效库存中、Barcode 唯一约束或其他硬冲突。
      required:
      - acknowledgementToken
      properties:
        acknowledgementToken:
          type: string
          description: 后端针对特定疑似重复候选签发的短期、不透明确认标识；客户端不得自行生成或解析。
          example: dup_ack_01J9Y7F4M8K2Q6R3V5T1
