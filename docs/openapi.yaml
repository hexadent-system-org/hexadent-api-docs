openapi: 3.1.0
info:
  title: HexaDent AI Inventory Platform API
  version: 0.6.0
  description: Web、iOS 与 Android MVP 的统一业务 API Contract。Purchase List 章节是 contract-first replacement，runtime 尚未实现。生产域名待定。
servers:
- url: /v1
  description: 相对 API 版本路径；生产域名待定
security:
- bearerAuth: []
tags:
- name: Auth
  description: '**Supabase Client Auth** — 以下由 React/Vite Web 与 React Native App 通过 `@supabase/supabase-js` 调用，不是 FastAPI
    Endpoint，密码不传给 FastAPI。两端使用相同 Auth 方法；React Native 需另外配置 AsyncStorage、AppState Token Refresh 和 Deep Linking。


    - **Sign up:** `signUp({ email, password })` → Supabase 创建未验证用户并发送验证邮件；此时 HexaDent API 不创建业务数据。

    - **Verify email:** `verifyOtp({ token_hash, type: ''email'' })` → Session → 填写诊所资料并调用 `POST /onboarding`。

    - **Resend verification:** `resend({ type: ''signup'', email })` → Supabase 重新发送验证邮件。


    - **Login:** `signInWithPassword({ email, password })` → Session → 携带 Access Token 调用 `GET /me`。

    - **Forgot password:** `resetPasswordForEmail(email)` → 发送 Recovery Email，页面统一显示“如果账号存在，将收到重置邮件”。

    - **Reset from email:** `verifyOtp({ token_hash, type: ''recovery'' })` → `updateUser({ password: newPassword })`。

    - **Change password:** `updateUser({ email, current_password, password })`；Supabase 开启 Require current password。

    - **Sign out:** `signOut()` 清除当前浏览器 Session。


    页面路由、提示文案与客户端错误处理由 Web / App 需求与设计文档定义；下方 Operations 均为 FastAPI Contract。'
- name: Account
- name: Lookups
- name: Products
- name: Inventory - Items
- name: Inventory - Activities
- name: Inventory - Imports
- name: Purchase Lists
- name: Dashboard
  description: 4 个独立只读模块；2026-09-23 确认的 contract-first replacement，运行时由后续任务实现。详见 dashboard-contract.md。
- name: Analytics
- name: Notifications
paths:
  /onboarding:
    post:
      tags:
      - Account
      operationId: completeOnboarding
      summary: 为已验证用户创建诊所 Workspace
      responses:
        '200':
          description: Workspace 创建完成，或当前用户已经完成 Onboarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Supabase 用户尚未验证邮箱，或账户状态不允许创建 Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前账户上下文冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Supabase Auth 或数据库暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      description: '客户端必须先通过 Supabase signUp 和 verifyOtp 完成邮箱验证。调用本接口时携带 Supabase Access Token；后端从 Token
        识别 User，再通过 Supabase Auth 确认邮箱已验证。接口幂等创建 User Profile、Active Organization 和 founding Active Admin Membership。
        客户端必须明确接受当前 Terms of Service 与 Privacy Policy；服务端用当前配置的文档版本和服务端时间写入不可覆盖的 Consent 记录。
        客户端不得提交 userId、登录邮箱、密码、文档版本、角色或状态。尚未完成 Onboarding 的已验证用户再次登录时，客户端应返回 Workspace Setup 页面。'
  /me:
    get:
      tags:
      - Account
      operationId: getCurrentContext
      summary: 获取当前账户与租户上下文
      responses:
        '200':
          description: 当前上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 返回 `ONBOARDING_REQUIRED` 时客户端进入 Workspace Setup；其他情况表示 Membership 或 Organization 不允许访问
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/profile:
    patch:
      tags:
      - Account
      operationId: updateCurrentProfile
      summary: 更新当前账户姓名
      responses:
        '200':
          description: 更新后的 Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
  /me/organization:
    get:
      tags:
      - Account
      operationId: getCurrentOrganization
      summary: 获取当前诊所设置
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
