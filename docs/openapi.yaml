components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Access Token
  schemas:
    EntityReference:
      type: object
      required:
      - id
      - name
      properties:
        id: *id001
        name:
          type: string
    CategoryReference:
      allOf:
      - $ref: '#/components/schemas/EntityReference'
      - type: object
        required:
        - slug
        properties:
          slug:
            type: string
    Pagination:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      - hasNextPage
      - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    CursorPageInfo:
      type: object
      required:
      - nextCursor
      - hasNextPage
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: 后端生成的不透明分页标记；客户端原样回传。
        hasNextPage:
          type: boolean
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
