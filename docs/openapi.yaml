                allVisibleBrands:
                  summary: 不传 keyword 时的可选 Brand 列表
                  value:
                    items:
                    - id: 11111111-1111-4111-8111-111111111111
                      name: 3M
                    - id: 22222222-2222-4222-8222-222222222222
                      name: Dentsply Sirona
                    - id: 33333333-3333-4333-8333-333333333333
                      name: Kerr Dental
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: keyword
        in: query
        required: false
        description: 可选；省略或 trim 后为空时返回全部可见 Brands；否则按名称不区分大小写包含匹配。
        schema:
          type: string
          maxLength: 160
      description: 不传 `keyword` 或 trim 后为空时返回全部可见 Brands；传入时按名称进行不区分大小写的包含匹配。
    post:
      tags:
      - Lookups
      operationId: createBrand
      summary: 创建或复用 Organization Brand
      responses:
        '200':
          description: 已创建或复用的资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityReference'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreateRequest'
  /units:
    get:
      tags:
      - Lookups
      operationId: listUnits
      summary: 查询可见 Unit
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityReferenceList'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: keyword
        in: query
        required: false
        description: 可选；省略或 trim 后为空时返回全部可见 Units，否则按名称筛选。
        schema:
          type: string
          maxLength: 80
      description: 不传 `keyword` 或 trim 后为空时返回全部可见 Units；传入时按名称进行不区分大小写的包含匹配。
    post:
      tags:
      - Lookups
      operationId: createUnit
      summary: 创建或复用 Organization Unit
      responses:
        '200':
          description: 已创建或复用的资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityReference'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreateRequest'
  /categories:
    get:
      tags:
      - Lookups
      operationId: listCategories
      summary: 查询全部父级 Categories
      responses:
        '200':
