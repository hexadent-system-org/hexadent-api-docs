components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Access Token
  schemas:
    EntityReference:
      type: object
      required:
      - id
      - name
      properties:
        id: *id001
        name:
          type: string
    CategoryReference:
      allOf:
      - $ref: '#/components/schemas/EntityReference'
      - type: object
        required:
        - slug
        properties:
          slug:
            type: string
    Pagination:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      - hasNextPage
      - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    CursorPageInfo:
      type: object
      required:
      - nextCursor
      - hasNextPage
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: 后端生成的不透明分页标记；客户端原样回传。
        hasNextPage:
          type: boolean
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ApiError:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    InventoryItemReference:
      type: object
      required:
      - id
      properties:
        id: *id001
    ProductSummary:
      type: object
      required:
      - id
      - visibilityScope
      - editable
      - name
      - brand
      - category
      - unit
      - containedQuantity
      - containedUnit
      - inventoryItem
      properties:
        id: *id001
        visibilityScope:
          type: string
          enum:
          - global
          - organization
        editable:
          type: boolean
        name:
          type: string
        brand:
          anyOf:
          - $ref: '#/components/schemas/EntityReference'
          - type: 'null'
          description: Product 没有已知 Brand 时为 null。
        category:
          $ref: '#/components/schemas/CategoryReference'
        manufacturer: &id013
          type:
          - string
          - 'null'
        mfgNumber: *id013
        barcode: *id013
        specification: *id013
        unit:
          $ref: '#/components/schemas/EntityReference'
        containedQuantity:
          type:
          - string
          - 'null'
          pattern: ^[1-9]\d*(\.\d{1,4})?$|^0\.\d{1,4}$
          description: 一个 Purchase Unit 内包含的数量；与 containedUnit 同时为值或同时为 null。
          examples:
          - '20.0000'
        containedUnit:
          anyOf:
          - $ref: '#/components/schemas/EntityReference'
          - type: 'null'
          description: containedQuantity 对应的单位，例如 Capsule；与 containedQuantity 成对出现。
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Product 图片的临时签名访问地址；没有图片或签名失败时为 null。
        inventoryItem:
          anyOf:
          - $ref: '#/components/schemas/InventoryItemReference'
          - type: 'null'
          description: 当前 Product 对应的诊所 Inventory Item；尚未加入库存时为 null。
    ProductDetail:
      allOf:
      - $ref: '#/components/schemas/ProductSummary'
      - type: object
        required:
        - sourceType
        - status
        - createdAt
        - updatedAt
        properties:
          sourceType:
            type: string
            enum:
            - external_catalog_import
            - organization_manual_entry
            - platform_curated
          source: *id013
          sourceProductCode: *id013
          status:
            type: string
            enum:
            - active
            - inactive
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    ProductPage:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ManualProductInput:
      type: object
      required:
      - name
      - brandId
      - categoryId
      - unitId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        brandId: *id001
        categoryId: *id001
        manufacturer:
          type:
          - string
          - 'null'
          maxLength: 200
        mfgNumber:
          type:
          - string
          - 'null'
          maxLength: 160
        barcode:
          type:
          - string
          - 'null'
          maxLength: 160
        specification:
          type:
          - string
          - 'null'
          maxLength: 2000
        unitId: *id001
    ManualProductCreateInput:
      allOf:
      - $ref: '#/components/schemas/ManualProductInput'
      - type: object
        properties:
          containedQuantity:
            type:
            - string
            - 'null'
            pattern: ^(?:0\.\d{1,4}|[1-9]\d*(?:\.\d{1,4})?)$
            description: 可选；一个 Purchase Unit 内包含的数量。必须大于 0、最多四位小数，并与 containedUnitId 同时提供或同时省略。
            example: '20.0000'
          containedUnitId:
            anyOf:
            - *id001
            - type: 'null'
            description: 可选；containedQuantity 对应的 Unit ID。必须对当前 Organization 可见，并与 containedQuantity 同时提供或同时省略。
    ProductUpdateRequest:
      $ref: '#/components/schemas/ManualProductInput'
      description: 仅 Owner Organization 的 Manual Product 可修改。
    InventorySettingsInput:
      type: object
      required:
      - quantityOnHand
      - lowStockThreshold
      properties:
        quantityOnHand: &id014
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
          examples: &id018
          - '0.00'
          - '12.50'
          description: 非负数量或金额；最多两位小数。具体字段可附加大于零约束。
        lowStockThreshold: *id014
        location:
          type:
          - string
          - 'null'
          maxLength: 240
        vendor:
          type:
          - string
          - 'null'
          maxLength: 200
        vendorItemNumber:
          type:
          - string
          - 'null'
          maxLength: 160
        purchasePrice:
          anyOf:
          - *id014
          - type: 'null'
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        internalNote:
          type:
          - string
          - 'null'
          maxLength: 2000
    DuplicateAcknowledgement:
      type: object
      description: 用户已经确认仍要继续添加的一个疑似重复商品。后端必须重新校验该 Product 确实是本次请求的疑似重复候选，并且对当前 Organization 可见。
      required:
      - productId
      properties:
        productId: *id001
    AddLibraryInventoryItemRequest:
      title: Use an existing Product Library product
      type: object
      required:
      - sourceType
      - productId
      - inventory
      properties:
        sourceType:
          const: library_product
        productId: *id001
        inventory:
          $ref: '#/components/schemas/InventorySettingsInput'
        duplicateAcknowledgements:
          type: array
          description: 疑似重复确认列表。首次提交传空数组或省略；用户确认继续后，重试时加入已确认疑似重复商品的 `productId`。若确认多个候选，则分别加入数组。
          items:
            $ref: '#/components/schemas/DuplicateAcknowledgement'
          default: []
    AddManualInventoryItemRequest:
      title: Create a Manual Product and add it to Inventory
      type: object
      required:
      - sourceType
      - product
      - inventory
      properties:
        sourceType:
          const: manual_product
        product:
          $ref: '#/components/schemas/ManualProductCreateInput'
        inventory:
          $ref: '#/components/schemas/InventorySettingsInput'
        duplicateAcknowledgements:
          type: array
          maxItems: 1
          description: 疑似重复选择。首次提交传空数组或省略；用户选择一个候选后，重试时加入该 Product 的 `productId`。后端重新校验后复用该 Product，不创建新的 Manual Product。
          items:
            $ref: '#/components/schemas/DuplicateAcknowledgement'
          default: []
    AddInventoryItemRequest:
      oneOf:
      - $ref: '#/components/schemas/AddLibraryInventoryItemRequest'
      - $ref: '#/components/schemas/AddManualInventoryItemRequest'
      discriminator:
        propertyName: sourceType
        mapping:
          library_product: '#/components/schemas/AddLibraryInventoryItemRequest'
          manual_product: '#/components/schemas/AddManualInventoryItemRequest'
    InventoryItemSummary:
      type: object
      required:
      - id
      - product
      - brand
      - category
      - quantityOnHand
      - unit
      - lowStockThreshold
      - inventoryStatus
      - expiryStatus
      - imageUrl
      - version
      - createdAt
      - updatedAt
      properties:
        id: *id001
        product:
          $ref: '#/components/schemas/EntityReference'
        brand:
          anyOf:
          - $ref: '#/components/schemas/EntityReference'
          - type: 'null'
          description: Product 没有已知 Brand 时为 null。
        category:
          $ref: '#/components/schemas/CategoryReference'
        mfgNumber: *id013
        barcode: *id013
        quantityOnHand: *id014
        unit:
          $ref: '#/components/schemas/EntityReference'
        lowStockThreshold: *id014
        inventoryStatus:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        expiryStatus:
          type: string
          enum:
          - not_set
          - normal
          - expiring_soon
          - expired
        location: *id013
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Product 图片的临时签名访问地址；没有图片或签名失败时为 null。
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InventoryCapabilities:
      type: object
      required:
      - canEditInventory
      - canEditProduct
      - canAdjustQuantity
      - canRemove
      properties:
        canEditInventory:
          type: boolean
        canEditProduct:
          type: boolean
        canAdjustQuantity:
          type: boolean
        canRemove:
          type: boolean
    InventoryItemDetail:
      allOf:
      - $ref: '#/components/schemas/InventoryItemSummary'
