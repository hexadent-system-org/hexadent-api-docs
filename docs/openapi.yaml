    CategoryUsageTrend:
      type: object
      required:
      - period
      - fromDate
      - toDate
      - timezone
      - granularity
      - series
      - asOf
      properties:
        period:
          type: string
          enum:
          - last_6_months
          - last_12_months
          - last_24_months
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        granularity:
          type: string
          const: month
        series:
          type: array
          description: 只返回所选周期内有 Product Used 记录的 Category；每个返回的 Category 包含完整月份序列，无用量月份补 0。
          items:
            type: object
            required:
            - category
            - points
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              points:
                type: array
                items:
                  type: object
                  required:
                  - month
                  - quantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                      examples:
                      - 2026-08
                    quantityUsed: *id013
        asOf:
          type: string
          format: date-time
      example:
        period: last_6_months
        fromDate: '2026-03-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        granularity: month
        series:
        - category:
            id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
            name: Disposables
            slug: disposables
          points:
          - month: 2026-03
            quantityUsed: '32.00'
          - month: 2026-04
            quantityUsed: '0.00'
          - month: 2026-05
            quantityUsed: '41.00'
          - month: 2026-06
            quantityUsed: '38.00'
          - month: 2026-07
            quantityUsed: '45.00'
          - month: 2026-08
            quantityUsed: '18.00'
        asOf: '2026-08-12T15:30:45Z'
