        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: MVP 不接收查询参数，返回全部 Active Global 父级 Categories，不返回子类。
  /products:
    get:
      tags:
      - Products
      operationId: listProducts
      summary: 搜索 Product Library
      responses:
        '200':
          description: Product 分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: '`keyword`、`brandId` 和 `categoryId` 均可选，可组合筛选；不传某个参数时不应用该维度的过滤。`keyword` 对 Product 名称执行包含匹配：先进行 Unicode NFKC、连续空白折叠及大小写归一化。相同输入也会按 MFG Number 规则规范化（忽略空白及 `-`、`_`、`/`、`.`、`:` 分隔符）后执行精确匹配。Brand 仅通过 `brandId` 筛选，Barcode 不参与 Product Library keyword 搜索。'
      parameters:
      - &id002
        name: keyword
        in: query
        required: false
        description: 大小写不敏感的关键词搜索；服务端负责输入标准化，具体匹配字段和规则见各端点描述。
        schema:
          type: string
          maxLength: 300
      - name: brandId
        in: query
        required: false
        description: 可选；只返回指定 Brand 下的 Products。
        schema: &id001
          type: string
          format: uuid
      - name: categoryId
        in: query
        required: false
        description: 可选；只返回指定 Category 下的 Products。
        schema: *id001
      - &id003
        name: page
        in: query
        required: false
        description: 页码
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id004
        name: pageSize
        in: query
        required: false
        description: 每页数量
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
  /products/{productId}:
