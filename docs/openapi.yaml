          - inventoryItemId: 8e41d6c8-b0ce-49de-aa8a-eef2f0da7322
            inventoryItemAvailable: true
            productName: Nitrile Exam Gloves
            category:
              id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
              name: Disposables
              slug: disposables
            quantityUsed: '42.00'
            unitName: Box
            trendPercentage: '12.50'
        attentionItems:
          outOfStock:
          - inventoryItemId: 08f7c98d-0e52-433f-b555-05a8fc109e4e
            productName: Etch Gel
            category:
              id: 0dd6feea-e03e-493f-9408-7a3e5b947c77
              name: Restorative
              slug: restorative
            quantityOnHand: '0.00'
            unitName: Syringe
            lowStockThreshold: '5.00'
            inventoryStatus: out_of_stock
            expiryDate: null
            expiryStatus: not_set
            daysUntilExpiry: null
          lowStock: []
          expiringSoon: []
        purchaseListOverview:
          activeLists: 4
          itemsRemaining: 11
          readyToComplete: 1
          recentLists: []
        asOf: '2026-08-12T11:30:45-04:00'
    CategoryUsageTrend:
      type: object
      required:
      - period
      - fromDate
      - toDate
      - timezone
      - granularity
      - series
      - asOf
      properties:
        period:
          type: string
          enum:
          - last_6_months
          - last_12_months
          - last_24_months
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        granularity:
          type: string
          const: month
        series:
          type: array
          description: 只返回所选周期内有 Product Used 记录的 Category；每个返回的 Category 包含完整月份序列，无用量月份补 0。
          items:
            type: object
            required:
            - category
            - points
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              points:
                type: array
                items:
                  type: object
                  required:
                  - month
                  - quantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                      examples:
                      - 2026-08
                    quantityUsed: *id014
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        period: last_6_months
        fromDate: '2026-03-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        granularity: month
        series:
        - category:
            id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
            name: Disposables
            slug: disposables
          points:
          - month: 2026-03
            quantityUsed: '32.00'
          - month: 2026-04
            quantityUsed: '0.00'
          - month: 2026-05
            quantityUsed: '41.00'
          - month: 2026-06
            quantityUsed: '38.00'
          - month: 2026-07
            quantityUsed: '45.00'
          - month: 2026-08
            quantityUsed: '18.00'
        asOf: '2026-08-12T11:30:45-04:00'
    AnalyticsConsumptionTrend:
      type: object
      required:
      - period
      - fromDate
      - toDate
      - timezone
      - granularity
      - forecastHorizonMonths
      - series
      - asOf
      properties:
        period:
          type: string
          enum:
          - last_6_months
          - last_12_months
          - last_24_months
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        granularity:
          type: string
          const: month
        forecastHorizonMonths:
          type: integer
          const: 2
        series:
          type: array
          items:
            type: object
            required:
            - category
            - actualPoints
            - forecastPoints
            - forecastDataSufficiency
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              actualPoints:
                type: array
                description: 所选历史范围内的完整自然月序列；无用量月份补 0。
                items:
                  type: object
                  required:
                  - month
                  - quantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    quantityUsed: *id014
              forecastPoints:
                type: array
                maxItems: 2
                description: 未来两个自然月的预测；数据不足时为空数组。前端以无圆点虚线绘制。
                items:
                  type: object
                  required:
                  - month
                  - predictedQuantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    predictedQuantityUsed: *id014
              forecastDataSufficiency:
                type: object
                required:
                - status
                - completeWeeks
                - reason
                properties:
                  status:
                    type: string
                    enum:
                    - sufficient
                    - insufficient
                  completeWeeks:
                    type: integer
                    minimum: 0
                    maximum: 12
                  reason:
                    type:
                    - string
                    - 'null'
                    enum:
                    - fewer_than_4_complete_weeks
                    - no_valid_consumption
                    - null
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        period: last_6_months
        fromDate: '2026-03-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        granularity: month
        forecastHorizonMonths: 2
        series:
        - category:
            id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
            name: Disposables
            slug: disposables
          actualPoints:
          - month: 2026-07
            quantityUsed: '45.00'
          - month: 2026-08
            quantityUsed: '18.00'
          forecastPoints:
          - month: 2026-09
            predictedQuantityUsed: '47.00'
          - month: 2026-10
            predictedQuantityUsed: '49.00'
          forecastDataSufficiency:
            status: sufficient
            completeWeeks: 12
            reason: null
        asOf: '2026-08-12T11:30:45-04:00'
