        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 当前 Organization 下资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: productId
        in: path
        required: true
        description: Product ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
  /inventory/items:
    get:
      tags:
      - Inventory - Items
      operationId: listInventoryItems
      summary: 查询有效库存
      responses:
        '200':
          description: 库存分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemPage'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - *id002
      - name: brandId
        in: query
        required: false
        description: 可选；只返回指定 Brand 下的 Inventory Items。
        schema: *id001
      - name: categoryId
        in: query
        required: false
        description: Category ID
        schema: *id001
      - name: inventoryStatus
        in: query
        required: false
        description: 库存状态；可重复传递
        schema:
          type: array
          items:
            type: string
            enum:
            - in_stock
            - low_stock
            - out_of_stock
      - name: expiryStatus
        in: query
        required: false
        description: 有效期状态；可重复传递
        schema:
          type: array
          items:
            type: string
            enum:
            - not_set
            - normal
            - expiring_soon
            - expired
      - *id003
      - *id004
    post:
      tags:
      - Inventory - Items
      operationId: addInventoryItem
      summary: 从 Library 加入库存或创建 Manual Product 后加入库存
      responses:
        '200':
          description: 创建或恢复后的 Inventory Item
          content:
