        name: draftItemId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseDraftItemUpdateRequest'}
      responses:
        '200': {description: 更新后的 Draft item, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseDraftItem'}}}}
        '401': {description: Access Token 缺失、无效或已过期, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Membership 或 Organization 不允许操作, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: 当前 Organization 下不存在；跨租户 ID 同样返回 404, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Draft version 或幂等请求冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: 字段未通过校验, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    delete:
      tags: [Purchase Lists]
      operationId: deletePurchaseDraftItem
      summary: 从 shared Draft 移除 item
