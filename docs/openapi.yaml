        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
  /reference-data/regional-options:
    get:
      tags:
      - Lookups
      operationId: getRegionalOptions
      summary: 获取区域设置选项
      description: 返回 MVP 当前支持的 Country、Currency 与 IANA Timezone 选项，供 Settings 等客户端下拉框使用。Timezone 的 label 已包含 IANA ID，可由客户端直接展示。返回的是加拿大和美国范围内的产品支持值，不包含 ISO 或 IANA 的全部条目；客户端提交 Organization 设置时必须使用这里返回的稳定代码或 ID。
      responses:
        '200':
          description: 区域设置选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionalOptions'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership 或 Organization 状态不允许访问
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
