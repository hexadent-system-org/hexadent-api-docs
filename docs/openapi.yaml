    Notification:
      description: 正文及商品名为生成时快照；readAt 与 resolvedAt 独立。resolvedAt 表示异常周期结束，不提供手动 Resolve 或库存细分状态标签。
      type: object
      required:
      - id
      - type
      - title
      - message
      - productName
      - inventoryItemAvailable
      - createdAt
      - readAt
      - resolvedAt
      - navigation
      properties:
        id: *id001
        type:
          type: string
          enum:
          - low_stock
          - out_of_stock
          - expiring_soon
        title:
          type: string
        message:
          type: string
        productName:
          type: string
        inventoryItemId:
          type:
          - string
          - 'null'
          format: uuid
        inventoryItemAvailable:
          type: boolean
        readAt:
          type:
          - string
          - 'null'
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: 对应异常周期结束时间；结束历史仍在列表，库存删除仅使 inventoryItemAvailable=false
        createdAt:
          type: string
          format: date-time
        navigation:
          type: object
          additionalProperties: false
          required: [kind, inventoryItemId]
          properties:
            kind:
              type: string
              enum: [inventory_item, unavailable]
            inventoryItemId:
              type: [string, "null"]
              format: uuid
          description: 可用时指向库存项；删除时 kind=unavailable 且 inventoryItemId=null，禁止错误跳转
      example:
        id: 11111111-1111-4111-8111-111111111111
        type: low_stock
        title: Low stock
        message: Nitrile Gloves are running low (4 remaining, minimum 5).
        productName: Nitrile Gloves
        inventoryItemId: 22222222-2222-4222-8222-222222222222
        inventoryItemAvailable: true
        readAt: null
        resolvedAt: null
        createdAt: '2026-09-14T13:00:00Z'
        navigation:
          kind: inventory_item
          inventoryItemId: 22222222-2222-4222-8222-222222222222
