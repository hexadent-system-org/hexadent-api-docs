              schema:
                $ref: '#/components/schemas/EntityReferenceList'
              examples:
                allVisibleBrands:
                  summary: 不传 keyword 时的可选 Brand 列表
                  value:
                    items:
                    - id: 11111111-1111-4111-8111-111111111111
                      name: 3M
                    - id: 22222222-2222-4222-8222-222222222222
                      name: Dentsply Sirona
                    - id: 33333333-3333-4333-8333-333333333333
                      name: Kerr Dental
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: keyword
        in: query
        required: false
        description: 可选；省略或 trim 后为空时返回全部可见 Brands；否则按名称不区分大小写包含匹配。
        schema:
          type: string
          maxLength: 160
      description: 不传 `keyword` 或 trim 后为空时返回全部可见 Brands；传入时按名称进行不区分大小写的包含匹配。
    post:
      tags:
      - Lookups
      operationId: createBrand
      summary: 创建或复用 Organization Brand
      responses:
        '200':
          description: 已创建或复用的资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityReference'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreateRequest'
  /units:
    get:
      tags:
      - Lookups
      operationId: listUnits
      summary: 查询可见 Unit
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityReferenceList'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: keyword
        in: query
        required: false
        description: 可选；省略或 trim 后为空时返回全部可见 Units，否则按名称筛选。
        schema:
          type: string
          maxLength: 80
      description: 不传 `keyword` 或 trim 后为空时返回全部可见 Units；传入时按名称进行不区分大小写的包含匹配。
    post:
      tags:
      - Lookups
      operationId: createUnit
      summary: 创建或复用 Organization Unit
      responses:
        '200':
          description: 已创建或复用的资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityReference'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreateRequest'
  /categories:
    get:
      tags:
      - Lookups
      operationId: listCategories
      summary: 查询全部父级 Categories
      responses:
        '200':
          description: Category 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: MVP 不接收查询参数，返回全部 Active Global 父级 Categories，不返回子类。
  /products:
    get:
      tags:
      - Products
      operationId: listProducts
      summary: 搜索 Product Library
      responses:
        '200':
          description: Product 分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 当前用户存在多个 Organization Membership，需要先选择 Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 数据库或服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: '`keyword`、`brandId` 和 `categoryId` 均可选，可组合筛选；不传某个参数时不应用该维度的过滤。`keyword` 对 Product 名称执行包含匹配：先进行 Unicode NFKC、连续空白折叠及大小写归一化。相同输入也会按 MFG Number 规则规范化（忽略空白及 `-`、`_`、`/`、`.`、`:` 分隔符）后执行精确匹配。Brand 仅通过 `brandId` 筛选，Barcode 不参与 Product Library keyword 搜索。'
      parameters:
      - &id002
        name: keyword
        in: query
        required: false
        description: 大小写不敏感的关键词搜索；服务端负责输入标准化，具体匹配字段和规则见各端点描述。
        schema:
          type: string
          maxLength: 300
      - name: brandId
        in: query
        required: false
        description: 可选；只返回指定 Brand 下的 Products。
        schema: &id001
          type: string
          format: uuid
      - name: categoryId
        in: query
        required: false
        description: 可选；只返回指定 Category 下的 Products。
        schema: *id001
      - &id003
        name: page
        in: query
        required: false
        description: 页码
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id004
        name: pageSize
        in: query
        required: false
        description: 每页数量
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
  /products/{productId}:
    get:
      tags:
      - Products
