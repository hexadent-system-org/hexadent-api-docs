              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: 可同时或分别提交 preferences、channels；未提交字段保持不变。In-App 固定开启，inAppEnabled 为非法字段。关闭保留历史；类型重开只补当前异常缺失的站内记录，不恢复 Dismiss 或补发旧 Push；Email 重开等下一计划摘要。通知邮箱通过独立验证流程修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsUpdate'
  /notifications/settings/email-change-requests:
    post:
      tags:
      - Notifications
      operationId: requestNotificationEmailChange
      summary: 请求验证新的通知邮箱
      description: 当前成员请求更换通知邮箱；新地址 Pending，旧 verifiedAddress 继续有效。新请求替代旧请求，发送失败保留可恢复状态。验证链接机制独立于 Auth 登录邮箱；TTL和限流数值须在实现前完成合同核实，不由 Push 有效期推导。
      responses:
        '200':
          description: 验证邮件已请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 请求频率超过限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 依赖服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /notifications/settings/email-verifications:
    post:
      tags:
      - Notifications
      operationId: verifyNotificationEmail
      summary: 确认新的通知邮箱
      description: 仅当前认证成员可验证自己的最新 Pending 请求；成功原子提升 verifiedAddress 并清除 Pending，不改变 Auth 登录邮箱。Token 过期/被替代/已使用/跨成员时不切换地址，不泄露其他成员信息。
      responses:
        '200':
          description: Notification Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 资源状态、版本、重复数据或幂等请求冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
  /device-tokens/current:
    put:
      tags:
      - Notifications
      operationId: upsertCurrentDeviceToken
      summary: 注册或刷新当前 App Installation Push Token
      description: 注册或轮换当前 installation 的 Token；同一 installation 的 Token 变化不产生新的 Push 去重身份。必须绑定当前认证成员/诊所，换账号解除旧绑定；Token 不写日志。新设备注册不重放旧通知。
      responses:
        '200':
          description: Device Token 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResult'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
    delete:
      tags:
      - Notifications
      operationId: revokeCurrentDeviceToken
      summary: 撤销当前 App Installation Push Token
      description: 撤销 X-Installation-Id 指定的当前认证成员安装实例，重复撤销幂等；登出前调用。不得撤销其他成员的设备。
      parameters:
      - name: X-Installation-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
        description: 当前 App installationId，与注册请求一致
      responses:
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '204':
          description: 操作成功，无响应体
  /inventory/imports:
    get:
      tags:
      - Inventory - Imports
      operationId: listInventoryImports
      summary: 查询 Inventory Import History
      responses:
        '200':
          description: Inventory Import 分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImportPage'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: 仅 Web 使用。按 createdAt DESC、id DESC 返回当前 Organization 的 Import 记录；不返回 rawExtraction 或 reviewDraft。
      parameters:
      - name: status
