  /notifications:
    get:
      tags:
      - Notifications
      operationId: listNotifications
      summary: 查询当前成员的 Active Notifications
      description: 当前成员未 Dismiss 的通知历史，包含 resolved。按 createdAt/id 倒序，首次无 cursor/asOf 时使用服务端当前时间；展开另一 window 时复用首响应 asOf。cursor 绑定 asOf/window；recent 为 [asOf-7天, asOf]，earlier 为 [asOf-30天, asOf-7天)。createdAt 不随恢复或偏好重开刷新。类型关闭不删除历史。空列表显示 No new notifications（暂无新通知）。
      responses:
        '200':
          description: Notification Cursor Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          description: Access Token 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 当前 Membership、Organization 状态或角色不允许操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段未通过业务校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: window
        in: query
        required: false
        description: recent=最近7天；earlier=第8至30天
        schema:
          type: string
          enum:
          - recent
          - earlier
          default: recent
      - name: cursor
        in: query
        required: false
        description: 上一页返回的 nextCursor，原样传递；绑定 asOf/window。与显式 asOf 或 window 不一致时返回 REQUEST_VALIDATION_ERROR 422。
        schema:
          type: string
      - name: asOf
        in: query
        required: false
        description: 展开另一时间窗口时传首响应的 asOf，两窗口共享基准。省略且无 cursor 时使用服务端当前时间；有 cursor 时从 cursor 恢复。不得晚于当前时间；与 cursor 基准不一致返回 REQUEST_VALIDATION_ERROR 422。刷新须清空两个窗口/cursor，并重新取得基准。只固定时间边界，Read/Dismiss/Resolved 仍取当前状态。
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: 返回数量
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
