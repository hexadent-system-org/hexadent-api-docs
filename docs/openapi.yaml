          properties:
            approved: {type: integer, minimum: 0}
            ordered: {type: integer, minimum: 0}
            completed: {type: integer, minimum: 0}
    PurchaseListApprovalRequest:
      type: object
      additionalProperties: false
      required: [name, selectedApproverMembershipId, draftItems]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        notes: {type: [string, 'null'], maxLength: 2000}
        selectedApproverMembershipId: *id001
        draftItems:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [draftItemId, expectedVersion]
            properties:
              draftItemId: *id001
              expectedVersion: {type: integer, minimum: 1}
    PurchaseListVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedListVersion]
      properties:
        expectedListVersion: {type: integer, minimum: 1}
    PurchaseListCancellationRequest:
      type: object
      additionalProperties: false
      required: [expectedListVersion]
      properties:
        expectedListVersion: {type: integer, minimum: 1}
        reason: {type: [string, 'null'], maxLength: 1000}
    PurchaseListCancellationResult:
      type: object
      required: [purchaseList, restoredDraftItems]
      properties:
        purchaseList: {$ref: '#/components/schemas/PurchaseListDetail'}
        restoredDraftItems:
          type: array
          description: '`merged` 表示数量累加到已有 Draft row；`created` 表示新建。'
          items:
            type: object
            required: [disposition, draftItem]
            properties:
              disposition: {type: string, enum: [created, merged]}
              draftItem: {$ref: '#/components/schemas/PurchaseDraftItem'}
    PurchaseListCompletionRequest:
      type: object
      additionalProperties: false
      required: [expectedListVersion, confirmVariance]
      properties:
        expectedListVersion: {type: integer, minimum: 1}
        confirmVariance:
          type: boolean
          description: 有任何 zero/short/over variance 时必须为 true；exact-only List 可为 false。
    PurchaseReceiptRequest:
      type: object
      additionalProperties: false
      required: [quantityReceived, expectedListVersion, expectedItemVersion]
      properties:
        quantityReceived: {$ref: '#/components/schemas/PurchaseQuantityInput'}
        expectedListVersion: {type: integer, minimum: 1}
        expectedItemVersion: {type: integer, minimum: 1}
        vendorReceiptNumber: {type: [string, 'null'], maxLength: 160}
        receivedAt: {type: [string, 'null'], format: date-time}
    PurchaseReceiptCorrectionRequest:
      type: object
      additionalProperties: false
      required: [totalReceived, expectedListVersion, expectedItemVersion]
      properties:
        totalReceived: {$ref: '#/components/schemas/PurchaseReceivedQuantityInput'}
        expectedListVersion: {type: integer, minimum: 1}
        expectedItemVersion: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
        correctedAt: {type: [string, 'null'], format: date-time}
    PurchaseReceiptEvent:
      type: object
      required: [id, eventType, quantityDelta, totalReceivedAfter, occurredAt, actor]
      properties:
        id: *id001
        eventType: {type: string, enum: [receipt, correction]}
        quantityDelta: *id016
        totalReceivedAfter: *id014
        vendorReceiptNumber: *id013
        reason: *id013
        occurredAt: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/PurchaseActor'}
    InventoryActivityReference:
      type: object
      required: [id, inventoryItemId, version]
      properties:
        id: *id001
        inventoryItemId: *id001
        version: {type: integer, minimum: 1}
    PurchaseReceiptWarning:
      type: object
      required: [code, plannedQuantity, totalReceived, overReceivedBy]
      properties:
        code: {type: string, const: PURCHASE_ITEM_OVER_RECEIVED}
        plannedQuantity: *id015
        totalReceived: *id014
        overReceivedBy: *id015
    PurchaseReceiptResult:
      type: object
      required: [event, activity, purchaseListItem, inventoryVersion, warning]
      properties:
        event: {$ref: '#/components/schemas/PurchaseReceiptEvent'}
        activity: {$ref: '#/components/schemas/InventoryActivityReference'}
        purchaseListItem: {$ref: '#/components/schemas/PurchaseListItem'}
        inventoryVersion: {type: integer, minimum: 1}
        warning: {anyOf: [{$ref: '#/components/schemas/PurchaseReceiptWarning'}, {type: 'null'}]}
    PurchaseReceiptCorrectionResult:
      type: object
      required: [noOp, event, activity, purchaseListItem, inventoryVersion]
      properties:
        noOp: {type: boolean}
        event: {anyOf: [{$ref: '#/components/schemas/PurchaseReceiptEvent'}, {type: 'null'}]}
        activity: {anyOf: [{$ref: '#/components/schemas/InventoryActivityReference'}, {type: 'null'}]}
        purchaseListItem: {$ref: '#/components/schemas/PurchaseListItem'}
        inventoryVersion: {type: integer, minimum: 1}
        warning: {anyOf: [{$ref: '#/components/schemas/PurchaseReceiptWarning'}, {type: 'null'}]}
    PurchaseListVarianceSummary:
      type: object
      description: '`PURCHASE_LIST_VARIANCE_CONFIRMATION_REQUIRED` 的 `error.details.variance` shape。'
      required: [zeroReceivedItemCount, shortItemCount, overItemCount, items]
      properties:
        zeroReceivedItemCount: {type: integer, minimum: 0}
        shortItemCount: {type: integer, minimum: 0}
        overItemCount: {type: integer, minimum: 0}
        items:
          type: array
          items:
            type: object
            required: [purchaseListItemId, plannedQuantity, receivedQuantity, varianceQuantity, receiptStatus]
            properties:
              purchaseListItemId: *id001
              plannedQuantity: *id015
              receivedQuantity: *id014
              varianceQuantity: *id016
              receiptStatus: {type: string, enum: [not_received, partially_received, over_received]}
    DashboardSnapshot:
      type: object
      required:
      - timezone
      - asOf
      properties:
        timezone:
          type: string
          description: 当前 Organization 的 IANA 时区，所有日期边界由服务端按此计算。
        asOf:
          type: string
          format: date-time
          examples: &id017
          - '2026-08-12T11:30:45-04:00'
          description: 同一响应内所有计数、列表及日期使用同一数据库读取快照与截止时刻；必须为 Organization 时区、带 UTC Offset 的 RFC 3339 时间。四个接口可并行请求，各自 asOf 独立，不承诺跨请求原子快照。
    DashboardSummary:
      type: object
      required:
      - totalItems
      - lowStockItems
      - outOfStockItems
      - expiringSoonItems
      properties:
        totalItems:
          type: integer
          minimum: 0
          description: 当前组织未删除的 Inventory 记录数，含零库存；不是 quantity 合计。
        lowStockItems:
          type: integer
          minimum: 0
          description: quantityOnHand > 0 且 <= lowStockThreshold 的未删除库存记录数。
        outOfStockItems:
          type: integer
          minimum: 0
          description: quantityOnHand = 0 的未删除库存记录数；与 lowStockItems 互斥。
        expiringSoonItems:
          type: integer
          minimum: 0
          description: expiryDate 在 asOf 的诊所当地日期今天至今天 + 30 天内（含两端）；与数量独立，零库存仍计入。已过期及未设置到期日不计入。
      description: 全部为当前 Organization 的全量计数，不受关注列表每组 5 条的上限影响。
    DashboardAttentionItem:
      type: object
      required:
      - inventoryItemId
      - productName
      - category
      - quantityOnHand
      - unitName
      - lowStockThreshold
      - inventoryStatus
      - expiryDate
      - expiryStatus
      - daysUntilExpiry
      properties:
        inventoryItemId:
          type: string
          format: uuid
        productName:
          type: string
        category:
          $ref: '#/components/schemas/CategoryReference'
        quantityOnHand:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
        unitName:
          type: string
        lowStockThreshold:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
        inventoryStatus:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
          description: quantity=0 为 out_of_stock；否则 quantity<=threshold 为 low_stock；其余为 in_stock。
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        expiryStatus:
          type: string
          enum:
          - not_set
          - normal
          - expiring_soon
          - expired
          description: 无日期为 not_set；daysUntilExpiry<0 为 expired；0..30 为 expiring_soon；大于 30 为 normal。它与 inventoryStatus 独立；保留 expired
            数据值，但 Dashboard 不新增 Expired 标签或提醒。
        daysUntilExpiry:
          type:
          - integer
          - 'null'
          description: expiryDate 减去 asOf 在 Organization 时区的当地日期；过期为负数，无日期为 null。
      description: 同一条库存可同时显示库存状态与临期状态；库存已删除则不出现在关注列表。productName、category、unitName 为当前库存关联商品的信息。
    DashboardAttentionItems:
      type: object
      required:
      - counts
      - all
      - lowStock
      - outOfStock
      - expiringSoon
      properties:
        counts:
          type: object
          required:
          - all
          - lowStock
          - outOfStock
          - expiringSoon
          properties:
            all:
              type: integer
              minimum: 0
              description: 三个筛选的全量并集，按 inventoryItemId 去重；不是三个计数直接相加。
            lowStock:
              type: integer
              minimum: 0
              description: 等于 summary.lowStockItems。
            outOfStock:
              type: integer
              minimum: 0
              description: 等于 summary.outOfStockItems。
            expiringSoon:
              type: integer
              minimum: 0
              description: 等于 summary.expiringSoonItems。
        all:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionItem'
          description: 独立从完整并集排序后取前 5，不可拼接三个已截断列表后生成。Low Stock → Out of Stock → 仅 Expiring Soon；同级 expiryDate ASC（null 最后）、productName
            ASC、inventoryItemId ASC。
        lowStock:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionItem'
          description: 仅 low_stock；expiryDate ASC（null 最后）、productName ASC、inventoryItemId ASC。
        outOfStock:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionItem'
          description: 仅 out_of_stock；expiryDate ASC（null 最后）、productName ASC、inventoryItemId ASC。
        expiringSoon:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionItem'
          description: 仅 daysUntilExpiry 在 0..30，含零库存；expiryDate ASC、productName ASC、inventoryItemId ASC。
      description: 无分页。每组长度=min(全量匹配数,5)；空组为 []。名称按 Unicode 码点升序、ID 按 UUID 升序作稳定排序。过期库存若为 low_stock/out_of_stock，仍进入对应列表与 All；不进入 expiringSoon。
    DashboardInventorySummary:
      allOf:
      - $ref: '#/components/schemas/DashboardSnapshot'
      - type: object
        required:
        - summary
        - attentionItems
        properties:
          summary:
            $ref: '#/components/schemas/DashboardSummary'
          attentionItems:
            $ref: '#/components/schemas/DashboardAttentionItems'
    DashboardTopUsedProduct:
      type: object
      required:
      - inventoryItemId
      - inventoryItemAvailable
      - productName
      - category
      - quantityUsed
      - unitName
      - trendPercentage
      properties:
        inventoryItemId:
          type: string
          format: uuid
        inventoryItemAvailable:
          type: boolean
          description: 该库存记录未移出时为 true，已软删除时为 false；不影响历史用量资格。榜单所有行都不提供详情跳转。
        productName:
          type: string
          description: 当前统计期内最后一条符合条件的 Activity.productNameSnapshot；以 occurredAt DESC、activity ID DESC 确定最后一条。
        category:
          $ref: '#/components/schemas/CategoryReference'
          description: 该 Inventory 对应 Product 当前的 Category 引用（保留的商品/类别记录，即使已软删除）；不是 Activity 时点的类别快照。不得因库存移出而丢弃历史用量，不要求新增历史类别回填。
        quantityUsed:
          type: string
          pattern: ^(?:0\.(?:0[1-9]|[1-9]\d?)|[1-9]\d*(?:\.\d{1,2})?)$
          description: 本期所有符合条件 Activity 的 -quantityDelta 之和；必须大于 0，按该库存商品自身单位计数，不换算单位或金额。
        unitName:
          type: string
          description: 与 productName 使用同一条 Activity.unitNameSnapshot；沿用现有库存单位，不做跨单位换算。
        trendPercentage:
          anyOf:
          - type: string
            pattern: ^-?(0|[1-9]\d*)\.\d{2}$
          - type: 'null'
          description: (本期用量-前期用量)/前期用量×100，Decimal ROUND_HALF_UP 至两位小数；前期为 0 返回 null，Web 显示 —，不得返回 Infinity。前期按同一 inventoryItemId
            的全部合格活动计算，不受前期是否上榜影响。
    DashboardTopUsedProducts:
      allOf:
      - $ref: '#/components/schemas/DashboardSnapshot'
      - type: object
        required:
        - period
        - fromDate
        - toDate
        - previousFromDate
        - previousToDate
        - items
        properties:
          period:
            type: string
            const: 30d
          fromDate:
            type: string
            format: date
            description: 当前诊所日期 D 减 29 天，含当天当地零点；例如 D=2026-09-23，fromDate=2026-08-25。
          toDate:
            type: string
            format: date
            description: asOf 的诊所当地日期 D，包含今天；当天仅累计 occurredAt <= asOf 的记录。
          previousFromDate:
            type: string
            format: date
            description: D 减 59 天，当地零点包含；例如 2026-07-26。
          previousToDate:
            type: string
            format: date
            description: D 减 30 天，包含该自然日；即本期 fromDate 当地零点之前，例如 2026-08-24。
          items:
            type: array
            maxItems: 5
            items:
              $ref: '#/components/schemas/DashboardTopUsedProduct'
            description: 只纳入本期用量 > 0 的库存记录；quantityUsed 数值 DESC、productName Unicode 码点 ASC、inventoryItemId ASC 排序，最多 5 条，空结果为 []。
        description: 以当前组织 Activity 为唯一数量来源，reasonCode=product_used 且 quantityDelta<0，按 inventoryItemId 分组。无论 Decrease 或 Set 操作，只要满足上述条件都累计实际减少量。排除
          data_correction、physical_stock_count_correction、损坏/过期、收货和其他原因；correction 不自动抵扣历史用量。窗口按诊所自然日定义，不按固定 720 小时；已移出当前库存的历史记录仍参与。
    DashboardPurchaseListOverview:
      allOf:
      - $ref: '#/components/schemas/DashboardSnapshot'
      - type: object
        required:
        - limit
        - weekStartDate
        - counts
        - lists
        properties:
          limit:
            type: integer
            minimum: 1
            maximum: 5
            description: 本次实际使用的每组列表上限；未传 query 时为 3。
          weekStartDate:
            type: string
            format: date
            description: asOf 所在诊所当地周的周一日期；周窗口从当地周一 00:00 到 asOf（含）。夏令时不改变自然周定义。
          counts:
            type: object
            required:
            - draftItems
            - approvedLists
            - orderedLists
            - completedThisWeek
            properties:
              draftItems:
                type: integer
                minimum: 0
                description: 当前组织共享 Draft 的商品行数，不是 plannedQuantity 合计。
              approvedLists:
                type: integer
                minimum: 0
                description: 当前 status=approved 的清单总数。
              orderedLists:
                type: integer
                minimum: 0
                description: 当前 status=ordered 的清单总数。
              completedThisWeek:
                type: integer
                minimum: 0
                description: 当前 status=completed 且 completedAt 在本地周一零点至 asOf（含）的清单数；不是累计 Completed，也不按 createdAt 计数。
          lists:
            type: object
            required:
            - approved
            - ordered
            - completedThisWeek
            properties:
              approved:
                type: array
                maxItems: 5
                items:
                  allOf:
                  - $ref: '#/components/schemas/PurchaseListSummary'
                  - type: object
                    properties:
                      status:
                        const: approved
                description: 当前 Approved 清单，最多 limit 条。
              ordered:
                type: array
                maxItems: 5
                items:
                  allOf:
                  - $ref: '#/components/schemas/PurchaseListSummary'
                  - type: object
                    properties:
                      status:
                        const: ordered
                description: 当前 Ordered 清单，最多 limit 条；receiptCounts 沿用采购页口径，不表示能否强制完成。
              completedThisWeek:
                type: array
                maxItems: 5
                items:
                  allOf:
                  - $ref: '#/components/schemas/PurchaseListSummary'
                  - type: object
                    properties:
                      status:
                        const: completed
                      completedAt:
                        type: string
                        format: date-time
                description: 仅本周 Completed 清单，最多 limit 条；不是最近创建或最近更新的 Completed。
            description: 三组均按 createdAt DESC、id DESC 排序，长度=min(对应完整计数,limit)，不分页；取消清单不进入任何组。
        description: 一次返回四个数字和三组列表，数字不受 limit 影响；切换 Approved/Ordered/Completed 不需要重新请求。默认 Web 选择 Ordered；Draft 使用独立跳转，不改变列表选择。移除旧 openLists/itemsRemaining/varianceFreeOrderedLists/recentLists
          指标，不修改采购生命周期及强制完成规则。
    DashboardPurchaseSpendPeriod:
      type: string
      enum:
      - last_6_months
      - last_12_months
      - last_24_months
      default: last_6_months
    DashboardPurchaseSpend:
      allOf:
      - $ref: '#/components/schemas/DashboardSnapshot'
      - type: object
        required:
        - period
        - fromDate
        - toDate
        - currencyCode
        - granularity
        - points
        properties:
          period:
            $ref: '#/components/schemas/DashboardPurchaseSpendPeriod'
          fromDate:
            type: string
            format: date
            description: 包含当月的 N 个月序列的首月 1 日。
          toDate:
            type: string
            format: date
            description: asOf 的诊所当地日期，包含当月截至 asOf 的收货。
          currencyCode:
            type: string
            enum:
            - CAD
            - USD
            description: 当前 Organization.currencyCode；沿用现有单币种价格约定，不做汇率换算。采购价格没有逐次收货币种快照；组织更改币种不会转换历史数值，此趋势是收货价值估算，不是多币种账本。
          granularity:
            type: string
            const: month
          points:
            type: array
            maxItems: 24
            items:
              type: object
              required:
              - month
              - amount
              properties:
                month:
                  type: string
                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                amount:
                  type: string
                  pattern: ^(0|[1-9]\d*)\.\d{2}$
                  description: 非负 Decimal 金额，固定两位小数字符串；不得使用浮点数累计。
            description: 按月份升序，恰好 N=6/12/24 条，month 唯一且连续；无收货或只有缺价收货的月份金额为 0.00。
            minItems: 6
        description: Purchase Spend / Value of supplies received。按实际入库且截至 asOf 已记录的有效收货数量 × 采购单 unitPrice 快照计算，按原收货 occurredAt 在 Organization
          时区归月。分批跨月分别计入；截至 asOf 的纠正必须回到被纠正收货的原月份，不能记在纠正月份。Ordered/Completed 状态变化、强制完成和 Inventory 当前价格不增加或重复计算金额；完成后已有有效收货仍保留。unitPrice=null
          的收货排除，不推算为已知零价；unitPrice=0 是有效零价。先以 Decimal 精确乘积累计每月金额，再按 ROUND_HALF_UP 四舍五入至两位小数。固定轻提示由 Web 展示：Estimated from received quantities
          and purchase prices. Items without a price are excluded. 当前跨批次纠正缺少原收货关联；补足关联、历史处理及验证是本接口实现前置条件，不得用纠正操作月份、比例分摊或最新一批猜测。详见 dashboard-contract.md。
      - oneOf:
        - type: object
          required: [period, points]
          properties:
            period: {const: last_6_months}
            points: {type: array, minItems: 6, maxItems: 6}
        - type: object
          required: [period, points]
          properties:
            period: {const: last_12_months}
            points: {type: array, minItems: 12, maxItems: 12}
        - type: object
          required: [period, points]
          properties:
            period: {const: last_24_months}
            points: {type: array, minItems: 24, maxItems: 24}
    AnalyticsConsumptionTrend:
      type: object
      required:
      - period
      - fromDate
      - toDate
      - timezone
      - granularity
      - forecastHorizonMonths
      - series
      - asOf
      properties:
        period:
          type: string
          enum:
          - last_6_months
          - last_12_months
          - last_24_months
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        timezone:
          type: string
          examples:
          - America/Toronto
        granularity:
          type: string
          const: month
        forecastHorizonMonths:
          type: integer
          const: 2
        series:
          type: array
          items:
            type: object
            required:
            - category
            - actualPoints
            - forecastPoints
            - forecastDataSufficiency
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              actualPoints:
                type: array
                description: 所选历史范围内的完整自然月序列；无用量月份补 0。
                items:
                  type: object
                  required:
                  - month
                  - quantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    quantityUsed: *id014
              forecastPoints:
                type: array
                maxItems: 2
                description: 未来两个自然月的预测；数据不足时为空数组。前端以无圆点虚线绘制。
                items:
                  type: object
                  required:
                  - month
                  - predictedQuantityUsed
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    predictedQuantityUsed: *id014
              forecastDataSufficiency:
                type: object
                required:
                - status
                - completeWeeks
                - reason
                properties:
                  status:
                    type: string
                    enum:
                    - sufficient
                    - insufficient
                  completeWeeks:
                    type: integer
                    minimum: 0
                    maximum: 12
                  reason:
                    type:
                    - string
                    - 'null'
                    enum:
                    - fewer_than_4_complete_weeks
                    - no_valid_consumption
                    - null
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
      example:
        period: last_6_months
        fromDate: '2026-03-01'
        toDate: '2026-08-12'
        timezone: America/Toronto
        granularity: month
        forecastHorizonMonths: 2
        series:
        - category:
            id: 1248917b-8218-4b9b-aeda-43d09fdedfd3
            name: Disposables
            slug: disposables
          actualPoints:
          - month: 2026-07
            quantityUsed: '45.00'
          - month: 2026-08
            quantityUsed: '18.00'
          forecastPoints:
          - month: 2026-09
            predictedQuantityUsed: '47.00'
          - month: 2026-10
            predictedQuantityUsed: '49.00'
          forecastDataSufficiency:
            status: sufficient
            completeWeeks: 12
            reason: null
        asOf: '2026-08-12T11:30:45-04:00'
    TimeSeries:
      type: object
      required:
      - series
      - asOf
      properties:
        series:
          type: array
          items:
            type: object
            required:
            - name
            - points
            properties:
              id:
                type:
                - string
                - 'null'
                format: uuid
              name:
                type: string
              points:
                type: array
                items:
                  type: object
                  required:
                  - period
                  - quantity
                  properties:
                    period:
                      type: string
                    quantity: *id014
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
    InventoryItemSummaryList:
      type: object
      required:
      - items
      - asOf
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemSummary'
        asOf:
          type: string
          format: date-time
          examples: *id017
          description: 服务器生成该统计或预测快照的时间。必须转换为当前 Organization Timezone，并以包含 UTC Offset 的 RFC 3339 Date-Time 返回；不得返回无 Offset
            的本地时间。
    AnalyticsSummary:
      type: object
      required:
      - monthlyConsumption
      - monthlyConsumptionChangePercentage
      - itemsReachingReorder
      - predictedStockouts
      properties:
        monthlyConsumption: *id014
        monthlyConsumptionChangePercentage:
          anyOf:
          - *id016
          - type: 'null'
          description: 相对上一个自然月的百分比变化；上月用量为 0 时返回 null。
        itemsReachingReorder:
          type: integer
          minimum: 0
        predictedStockouts:
          type: integer
          minimum: 0
    UsageBreakdown:
      type: object
      required:
      - totalQuantityUsed
      - items
      properties:
        totalQuantityUsed: *id014
        items:
          type: array
          items:
            type: object
            required:
            - category
            - quantityUsed
            - percentage
            properties:
              category:
                $ref: '#/components/schemas/CategoryReference'
              quantityUsed: *id014
              percentage: *id014
    ForecastPurchaseListReference:
      type: object
      description: 该 Buying Need 对应商品所在的一个 Approved 或 Ordered Purchase List，以及该商品在该 List 中的收货状态。
      required:
      - id
      - name
      - status
      - receiptStatus
      properties:
        id:
          type: string
          format: uuid
          description: Purchase List ID；前端用它进入 Purchase List Detail。
        name:
          type: string
          description: Purchase List Name。
        status:
          type: string
          enum: [approved, ordered]
        receiptStatus:
          type: string
          enum:
          - not_received
          - partially_received
          - received
          - over_received
          description: 当前 Forecast Item 在该 Purchase List 中的收货状态。
    ForecastDataSufficiency:
      type: object
      description: 该商品是否有足够的 Product Used 历史数据用于计算预测字段。
      required:
      - status
      - completeWeeks
      - reason
      properties:
        status:
          type: string
          enum:
          - sufficient
          - insufficient
        completeWeeks:
          type: integer
          minimum: 0
          maximum: 12
          description: 实际用于评估的完整历史周数，最多 12 周。
        reason:
          type:
          - string
          - 'null'
          enum:
          - fewer_than_4_complete_weeks
          - no_valid_consumption
          - null
          description: 数据充分时为 null；不足时返回稳定 Reason Code。
    ForecastItem:
      type: object
      description: Forecasted Buying Needs 表格中的一行。数量字段均使用该商品的 Unit。
      required:
      - inventoryItemId
      - productName
      - category
      - currentStock
      - unitName
      - averageWeeklyUse
      - predictedRunoutDate
      - recommendedQuantity
      - orderByDate
      - purchaseLists
      - dataSufficiency
      properties:
        inventoryItemId:
          type: string
          format: uuid
          description: Inventory Item ID。
        productName:
          type: string
          description: 当前 Product Name。
        category:
          $ref: '#/components/schemas/CategoryReference'
        currentStock:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
          examples: *id018
          description: 当前 Quantity On Hand。
        unitName:
          type: string
          description: 所有数量字段使用的 Unit。
        averageWeeklyUse:
          anyOf:
          - *id014
          - type: 'null'
          description: 最多最近 12 个完整周的平均 Product Used 数量；数据不足时为 null。
        predictedRunoutDate:
          type:
          - string
          - 'null'
          format: date
          description: 预计 Current Stock 降至 0 的诊所本地日期；无法预测时为 null。
        recommendedQuantity:
          anyOf:
          - *id014
          - type: 'null'
          description: 覆盖未来 30 天预计消耗并恢复 Minimum Quantity 的建议购买数量；无法预测时为 null。
        orderByDate:
          type:
          - string
          - 'null'
          format: date
          description: 建议下单日期，通常为预计达到 Minimum Quantity 日期前 7 天；无法预测时为 null。
        purchaseLists:
          type: array
          description: 该 Inventory Item 所在的全部 Approved/Ordered Purchase Lists；没有未关闭 List 时返回空数组。
          items:
            $ref: '#/components/schemas/ForecastPurchaseListReference'
        dataSufficiency:
          $ref: '#/components/schemas/ForecastDataSufficiency'
    ForecastItemList:
      type: object
      description: 后端固定按 orderByDate ASC NULLS LAST、predictedRunoutDate ASC NULLS LAST、productName ASC、inventoryItemId ASC
        排序。MVP 最多返回前 100 条；前端每页展示 5 条。
      required:
      - items
      - totalItems
      - maxItems
      - truncated
      properties:
        items:
          type: array
          maxItems: 100
          description: 按固定顺序一次返回，前端每页展示 5 条并自行分页与日期定位。
          items:
            $ref: '#/components/schemas/ForecastItem'
        totalItems:
          type: integer
          minimum: 0
          description: 符合 Forecasted Buying Needs 条件的总数。
        maxItems:
          type: integer
          const: 100
        truncated:
          type: boolean
          description: totalItems 大于 maxItems 时为 true；Calendar 仍只基于本次实际返回的 items 生成。
    RecommendedOrderDay:
      type: object
      description: Calendar 中一个有 Buying Needs 的高亮日期。
      required:
      - date
      - highestPriority
      - itemCount
      properties:
        date:
          type: string
          format: date
          description: 与 ForecastItem.orderByDate 对应的诊所本地日期。
        highestPriority:
          type: string
          enum:
          - high
          - medium
          - reorder_soon
          - planned
          description: 该日期所有匹配 Items 的最高优先级，仅用于 Calendar 颜色提示。
        itemCount:
          type: integer
          minimum: 1
          description: 本次实际返回的 forecastedBuyingNeeds.items 中，orderByDate 等于该日期的 Item 数量。
    RecommendedOrderMonth:
      type: object
      description: Recommended Order Timing Calendar 中的一个自然月。
      required:
      - month
      - days
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Calendar Month，格式 YYYY-MM。
        days:
          type: array
          description: 按 date ASC 返回；无建议下单日期时为空数组。只基于本次实际返回的 Buying Needs Items 生成。
          items:
            $ref: '#/components/schemas/RecommendedOrderDay'
    RecommendedOrderTiming:
      type: object
      description: Forecasted Buying Needs 的 Calendar 聚合视图。
      required:
      - fromMonth
      - toMonth
      - months
      properties:
        fromMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 允许查看的第一个月份，等于 Analysis Month。
        toMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 允许查看的最后一个月份，等于 Analysis Month 后第 3 个自然月。
        months:
          type: array
          minItems: 4
          maxItems: 4
          description: 固定按月份升序包含 Analysis Month 及之后 3 个自然月。
          items:
            $ref: '#/components/schemas/RecommendedOrderMonth'
    AnalyticsOverview:
